---
- name: Audit Section 6
  hosts: docker
  become: true
  gather_facts: true

  vars:
    report_dir:    /tmp/docker_benchmark
    report_base:   "./docker_benchmark_reports"
    report_file:   "{{ report_dir }}/section6_results.xlsx"
    json_file:     "{{ report_dir }}/section6_results.json"
    python_script: "{{ report_dir }}/generate_section6_report.py"
    audit_results: []

  tasks:

    # ──────────────────────────────────────────────
    # Pre-flight
    # ──────────────────────────────────────────────
    - name: "Pre | Create temp report directory"
      ansible.builtin.file:
        path: "{{ report_dir }}"
        state: directory
        mode: '0755'

    # ──────────────────────────────────────────────
    # 6.1 – Ensure that image sprawl is avoided
    # ──────────────────────────────────────────────
    # Image sprawl = many images on the host, most of which are no longer
    # used by any running container. Unused images are wasted disk space
    # and an expanded attack surface (stale, unpatched layers at rest).
    # The check compares active images (referenced by running containers)
    # against the total count. A large gap signals sprawl.
    - name: "6.1 | Count images actively used by running containers"
      ansible.builtin.shell:
        cmd: |
          {% raw %}docker ps -qa | xargs -r docker inspect --format "{{.Image}}" | sort -u | wc -l{% endraw %}
      register: active_images_command
      changed_when: false
      failed_when: false

    - name: "6.1 | Count all images on host"
      ansible.builtin.shell:
        cmd: "docker image list -a -q | wc -l"
      register: all_images_command
      changed_when: false
      failed_when: false

    - name: "6.1 | List all image IDs and tags for raw output"
      ansible.builtin.shell:
        cmd: "docker image list --format 'table {% raw %}{{.Repository}}:{{.Tag}}\t{{.ID}}\t{{.Size}}\t{{.CreatedSince}}{% endraw %}'"
      register: all_images_detail
      changed_when: false
      failed_when: false

    - name: "6.1 | Debug"
      ansible.builtin.debug:
        msg: >-
          [INFO] 6.1 - Ensure that image sprawl is avoided:
          {{ active_images_command.stdout | trim }} active image(s) of
          {{ all_images_command.stdout | trim }} total images

    - name: "6.1 | Collect result"
      ansible.builtin.set_fact:
        # Status logic:
        #   PASS  – every image on the host is referenced by a running container
        #   WARN  – there are unused images (most common real-world state)
        #   INFO  – cannot determine (docker commands failed)
        check_6_1_active: "{{ active_images_command.stdout | trim | int }}"
        check_6_1_total:  "{{ all_images_command.stdout  | trim | int }}"

    - name: "6.1 | Append to audit_results"
      ansible.builtin.set_fact:
        audit_results: "{{ audit_results + [{
          'id':      '6.1',
          'section': 'Section 6 - Docker Security Operations',
          'title':   'Ensure that image sprawl is avoided',
          'status':  'INFO'  if (active_images_command.rc != 0 or all_images_command.rc != 0)
                     else ('PASS' if check_6_1_total | int == check_6_1_active | int
                     else 'WARN'),
          'details': '[INFO] 6.1 - Could not retrieve image counts.'
                     if (active_images_command.rc != 0 or all_images_command.rc != 0)
                     else ('[PASS] 6.1 - No image sprawl detected. '
                           ~ check_6_1_active ~ ' active image(s), '
                           ~ check_6_1_total  ~ ' total.')
                     if check_6_1_total | int == check_6_1_active | int
                     else ('[WARN] 6.1 - Image sprawl detected: '
                           ~ check_6_1_active ~ ' active image(s) out of '
                           ~ check_6_1_total  ~ ' total. '
                           ~ ((check_6_1_total | int) - (check_6_1_active | int)) | string
                           ~ ' unused image(s) should be removed.'),
          'raw_output': all_images_detail.stdout | default('') | string,
          'remediation': 'Remove unused images regularly:
            docker image prune -a --filter until=720h
            Only keep images that are actively referenced by containers.
            Integrate image pruning into your CI/CD pipeline or run as a scheduled cron job.'
        }] }}"

    # ──────────────────────────────────────────────
    # 6.2 – Ensure that container sprawl is avoided
    # ──────────────────────────────────────────────
    # Container sprawl = large number of stopped/exited containers accumulating
    # on the host. Stopped containers still consume disk (their writable layer
    # is kept). Many stopped containers relative to running ones is a red flag.
    # CIS guideline: stopped containers should not significantly outnumber
    # running ones over time.
    - name: "6.2 | Get total container count"
      ansible.builtin.shell:
        cmd: "{% raw %}docker info --format '{{ .Containers }}'{% endraw %}"
      register: total_container_command
      changed_when: false
      failed_when: false

    - name: "6.2 | Get running container count"
      ansible.builtin.shell:
        cmd: "{% raw %}docker info --format '{{ .ContainersRunning }}'{% endraw %}"
      register: total_running_container_command
      changed_when: false
      failed_when: false

    - name: "6.2 | Get stopped container count"
      ansible.builtin.shell:
        cmd: "{% raw %}docker info --format '{{ .ContainersStopped }}'{% endraw %}"
      register: total_not_running_container_command
      changed_when: false
      failed_when: false

    - name: "6.2 | List all containers with status for raw output"
      ansible.builtin.shell:
        cmd: "docker ps -a --format 'table {% raw %}{{.ID}}\t{{.Image}}\t{{.Status}}\t{{.Names}}{% endraw %}'"
      register: all_containers_detail
      changed_when: false
      failed_when: false

    - name: "6.2 | Debug"
      ansible.builtin.debug:
        msg: >-
          [INFO] 6.2 - Ensure that container sprawl is avoided:
          {{ total_container_command.stdout | trim }} containers total,
          {{ total_running_container_command.stdout | trim }} running,
          {{ total_not_running_container_command.stdout | trim }} stopped

    - name: "6.2 | Set counts as facts"
      ansible.builtin.set_fact:
        check_6_2_total:   "{{ total_container_command.stdout         | trim | int }}"
        check_6_2_running: "{{ total_running_container_command.stdout | trim | int }}"
        check_6_2_stopped: "{{ total_not_running_container_command.stdout | trim | int }}"

    - name: "6.2 | Append to audit_results"
      ansible.builtin.set_fact:
        audit_results: "{{ audit_results + [{
          'id':      '6.2',
          'section': 'Section 6 - Docker Security Operations',
          'title':   'Ensure that container sprawl is avoided',
          'status':  'INFO'  if (total_container_command.rc != 0)
                     else ('PASS' if check_6_2_stopped | int == 0
                     else ('WARN' if check_6_2_stopped | int <= check_6_2_running | int
                     else 'FAIL')),
          'details': '[INFO] 6.2 - Could not retrieve container counts.'
                     if total_container_command.rc != 0
                     else ('[PASS] 6.2 - No stopped containers. '
                           ~ check_6_2_running ~ ' running, 0 stopped.')
                     if check_6_2_stopped | int == 0
                     else ('[WARN] 6.2 - '
                           ~ check_6_2_stopped ~ ' stopped container(s) alongside '
                           ~ check_6_2_running ~ ' running. Prune if no longer needed.')
                     if check_6_2_stopped | int <= check_6_2_running | int
                     else ('[FAIL] 6.2 - Significant container sprawl: '
                           ~ check_6_2_stopped ~ ' stopped vs '
                           ~ check_6_2_running ~ ' running containers. '
                           ~ check_6_2_total   ~ ' containers total.'),
          'raw_output': all_containers_detail.stdout | default('') | string,
          'remediation': 'Remove stopped containers that are no longer needed:
            docker container prune
            Prevent accumulation by always using --rm flag for one-off containers:
            docker run --rm <image> <command>
            Set up a scheduled prune job or integrate into your CI/CD cleanup stage.'
        }] }}"

    # ════════════════════════════════════════════════════════════════
    # REPORTING – JSON and XLSX
    # ════════════════════════════════════════════════════════════════

    - name: "Report | Create report directory"
      ansible.builtin.file:
        path: "{{ report_dir }}"
        state: directory
        mode: '0755'

    - name: "Report | Ensure openpyxl is installed"
      ansible.builtin.pip:
        name: openpyxl
        state: present
      failed_when: false

    - name: "Report | Compute summary counts"
      ansible.builtin.set_fact:
        summary_pass:  "{{ audit_results | selectattr('status', 'equalto', 'PASS') | list | length }}"
        summary_fail:  "{{ audit_results | selectattr('status', 'equalto', 'FAIL') | list | length }}"
        summary_warn:  "{{ audit_results | selectattr('status', 'equalto', 'WARN') | list | length }}"
        summary_info:  "{{ audit_results | selectattr('status', 'equalto', 'INFO') | list | length }}"
        summary_total: "{{ audit_results | length }}"

    # ── Step 1: Write JSON to target ─────────────────────────────────────
    - name: "Report | Write JSON results file to target"
      ansible.builtin.copy:
        dest: "{{ json_file }}"
        mode: '0644'
        content: "{{ {
          'meta': {
            'section':   'Section 6 - Docker Security Operations',
            'host':      ansible_hostname,
            'os':        ansible_distribution ~ ' ' ~ ansible_distribution_version,
            'generated': ansible_date_time.iso8601,
            'pass':  summary_pass  | int,
            'fail':  summary_fail  | int,
            'warn':  summary_warn  | int,
            'info':  summary_info  | int,
            'total': summary_total | int
          },
          'results': audit_results
        } | to_nice_json }}"

    # ── Step 2: Write Python script for Excel generation ─────────────────
    - name: "Report | Write Excel generator script"
      ansible.builtin.copy:
        dest: "{{ python_script }}"
        mode: '0700'
        content: |
          #!/usr/bin/env python3
          import json
          from openpyxl import Workbook
          from openpyxl.styles import Font, PatternFill, Alignment, Border, Side
          from openpyxl.chart import BarChart, PieChart, Reference

          JSON_FILE = "{{ json_file }}"
          OUTPUT    = "{{ report_file }}"

          with open(JSON_FILE) as fh:
              payload = json.load(fh)

          META    = payload["meta"]
          RESULTS = payload["results"]

          # ── Palette ────────────────────────────────────────────────────
          P = dict(
              NAVY    = "0F3460", DARK    = "1F2D3D", WHITE   = "FFFFFF",
              PASS_BG = "D6F4DC", PASS_FG = "1A6E2E",
              FAIL_BG = "FAD7D5", FAIL_FG = "9C2B26",
              WARN_BG = "FFF3CD", WARN_FG = "856404",
              INFO_BG = "FFF8DC", INFO_FG = "7A5800",
              ALT_ROW = "F6F8FA", BORDER  = "D0D7DE",
              SEC_BG  = "EBF0F7", SEC_FG  = "2D6A9F",
          )
          STATUS = {
              "PASS": (P["PASS_BG"], P["PASS_FG"], "PASS"),
              "FAIL": (P["FAIL_BG"], P["FAIL_FG"], "FAIL"),
              "WARN": (P["WARN_BG"], P["WARN_FG"], "WARN"),
              "INFO": (P["INFO_BG"], P["INFO_FG"], "INFO"),
          }

          def fill(c):      return PatternFill("solid", fgColor=c)
          def bdr(c=None):
              s = Side(style="thin", color=c or P["BORDER"])
              return Border(left=s, right=s, top=s, bottom=s)
          def font(bold=False, size=10, color="000000", italic=False):
              return Font(name="Arial", bold=bold, size=size, color=color, italic=italic)
          def align(h="left", v="center", wrap=True):
              return Alignment(horizontal=h, vertical=v, wrap_text=wrap)
          def safe(v):
              return v if isinstance(v, (str, int, float, bool, type(None))) else json.dumps(v)

          wb = Workbook()

          # ══════════════════════════════════════════════════════════════
          # Sheet 1 – SUMMARY DASHBOARD
          # ══════════════════════════════════════════════════════════════
          ws = wb.active
          ws.title = "Summary"
          ws.sheet_view.showGridLines = False
          ws.column_dimensions["A"].width = 2

          # Title banner
          ws.merge_cells("B1:L3")
          c = ws["B1"]
          c.value     = "CIS Docker Benchmark - Section 6"
          c.font      = font(bold=True, size=22, color=P["WHITE"])
          c.fill      = fill(P["NAVY"])
          c.alignment = align("left", "center", wrap=False)
          ws.row_dimensions[1].height = 18
          ws.row_dimensions[2].height = 22
          ws.row_dimensions[3].height = 18

          # Subtitle bar
          ws.merge_cells("B4:L4")
          sub = ws["B4"]
          sub.value = (f"Host: {META['host']}   |   OS: {META['os']}"
                       f"   |   Generated: {META['generated']}")
          sub.font      = font(size=9, color="CCCCCC", italic=True)
          sub.fill      = fill(P["DARK"])
          sub.alignment = align("left", "center", wrap=False)
          ws.row_dimensions[4].height = 16

          ws.row_dimensions[5].height = 12  # spacer

          # ── Stat cards ─────────────────────────────────────────────
          total = META["total"] or 1
          pct   = round(META["pass"] / total * 100, 1)

          cards = [
              ("B","D", "TOTAL CHECKS",    META["total"],  P["DARK"],    P["WHITE"]),
              ("E","G", "PASSED",          META["pass"],   P["PASS_BG"], P["PASS_FG"]),
              ("H","J", "FAILED",          META["fail"],   P["FAIL_BG"], P["FAIL_FG"]),
              ("K","L", "INFO / WARN",     META["info"] + META["warn"], P["INFO_BG"], P["INFO_FG"]),
          ]
          for c1, c2, label, val, bg, fg in cards:
              ws.merge_cells(f"{c1}6:{c2}6")
              lc = ws[f"{c1}6"]
              lc.value = label
              lc.font  = font(bold=True, size=8, color="666666")
              lc.fill  = fill("EAECEF")
              lc.alignment = align("center", "center", wrap=False)
              lc.border = bdr()
              ws.merge_cells(f"{c1}7:{c2}7")
              vc = ws[f"{c1}7"]
              vc.value = val
              vc.font  = font(bold=True, size=28, color=fg)
              vc.fill  = fill(bg)
              vc.alignment = align("center", "center", wrap=False)
              vc.border = bdr()
          ws.row_dimensions[6].height = 18
          ws.row_dimensions[7].height = 48

          ws.row_dimensions[8].height = 10  # spacer

          # ── Compliance progress bar (text) ─────────────────────────
          ws.merge_cells("B9:L9")
          bar = chr(9608) * int(pct / 5) + chr(9617) * (20 - int(pct / 5))
          bc = ws["B9"]
          bc.value = f"  Compliance Score:   {bar}   {pct}%  ({META['pass']} of {META['total']} checks passed)"
          bc.font  = font(bold=True, size=11, color=P["PASS_FG"] if pct >= 80 else P["FAIL_FG"])
          bc.fill  = fill("EAF4EA" if pct >= 80 else "FAE8E8")
          bc.alignment = align("left", "center", wrap=False)
          bc.border = bdr()
          ws.row_dimensions[9].height = 28

          ws.row_dimensions[10].height = 12  # spacer

          # ── Quick results table ────────────────────────────────────
          spans = {"B":("B","C"), "D":("D","H"), "I":("I","I"), "J":("J","L")}
          HDR = 11
          for col, hdr in zip(["B","D","I","J"], ["Check ID","Title","Status","Details"]):
              c1, c2 = spans[col]
              ws.merge_cells(f"{c1}{HDR}:{c2}{HDR}")
              cell = ws[f"{col}{HDR}"]
              cell.value     = hdr
              cell.font      = font(bold=True, size=10, color=P["WHITE"])
              cell.fill      = fill(P["DARK"])
              cell.alignment = align("center", "center", wrap=False)
              cell.border    = bdr()
          ws.row_dimensions[HDR].height = 22

          last_section = None
          row = HDR + 1
          for result in RESULTS:
              # Section divider row
              if result["section"] != last_section:
                  ws.merge_cells(f"B{row}:L{row}")
                  sc = ws[f"B{row}"]
                  sc.value     = result["section"]
                  sc.font      = font(bold=True, size=10, color=P["SEC_FG"])
                  sc.fill      = fill(P["SEC_BG"])
                  sc.alignment = align("left", "center", wrap=False)
                  sc.border    = bdr()
                  ws.row_dimensions[row].height = 20
                  last_section = result["section"]
                  row += 1

              bg = P["WHITE"] if row % 2 == 0 else P["ALT_ROW"]
              sbg, sfg, slabel = STATUS.get(result["status"],
                                            (P["INFO_BG"], P["INFO_FG"], result["status"]))
              row_data = {
                  "B": result["id"],
                  "D": result["title"],
                  "I": slabel,
                  "J": result["details"],
              }
              for col, val in row_data.items():
                  c1, c2 = spans[col]
                  ws.merge_cells(f"{c1}{row}:{c2}{row}")
                  cell = ws[f"{col}{row}"]
                  cell.value     = safe(val)
                  cell.border    = bdr()
                  cell.alignment = align("center" if col in ("B","I") else "left")
                  if col == "I":
                      cell.font = font(bold=True, color=sfg)
                      cell.fill = fill(sbg)
                  else:
                      cell.font = font()
                      cell.fill = fill(bg)
              ws.row_dimensions[row].height = 24
              row += 1

          # Column widths – Summary sheet
          for col, w in {"B":9,"C":3,"D":14,"E":7,"F":7,"G":7,
                         "H":7,"I":11,"J":16,"K":16,"L":16}.items():
              ws.column_dimensions[col].width = w

          # ══════════════════════════════════════════════════════════════
          # Sheet 2 – DETAILED RESULTS
          # ══════════════════════════════════════════════════════════════
          ws2 = wb.create_sheet("Detailed Results")
          ws2.sheet_view.showGridLines = False
          ws2.column_dimensions["A"].width = 2

          det_cols = [
              ("B","Check ID", 10), ("C","Section",  30),
              ("D","Title",    52), ("E","Status",    12),
              ("F","Details",  60),
          ]
          for col, label, width in det_cols:
              c = ws2[f"{col}1"]
              c.value     = label
              c.font      = font(bold=True, size=10, color=P["WHITE"])
              c.fill      = fill(P["DARK"])
              c.alignment = align("center", "center", wrap=False)
              c.border    = bdr()
              ws2.column_dimensions[col].width = width
          ws2.row_dimensions[1].height = 22

          for i, result in enumerate(RESULTS):
              r  = i + 2
              bg = P["WHITE"] if i % 2 == 0 else P["ALT_ROW"]
              sbg, sfg, slabel = STATUS.get(result["status"],
                                            (P["INFO_BG"], P["INFO_FG"], result["status"]))
              det = {
                  "B": result["id"],       "C": result["section"],
                  "D": result["title"],    "E": slabel,
                  "F": result["details"],
              }
              for col, val in det.items():
                  cell = ws2[f"{col}{r}"]
                  cell.value     = safe(val)
                  cell.border    = bdr()
                  cell.alignment = align("center" if col in ("B","E") else "left")
                  if col == "E":
                      cell.font = font(bold=True, color=sfg)
                      cell.fill = fill(sbg)
                  else:
                      cell.font = font()
                      cell.fill = fill(bg)
              ws2.row_dimensions[r].height = 36

          ws2.freeze_panes = "B2"
          ws2.auto_filter.ref = f"B1:F{len(RESULTS)+1}"

          # ══════════════════════════════════════════════════════════════
          # Sheet 3 – CHART
          # ══════════════════════════════════════════════════════════════
          ws3 = wb.create_sheet("Chart")
          ws3.sheet_view.showGridLines = False
          ws3.column_dimensions["A"].width = 2

          chart_data = [
              ("Status", "Count"),
              ("PASS",   META["pass"]),
              ("FAIL",   META["fail"]),
              ("WARN",   META["warn"]),
              ("INFO",   META["info"]),
          ]
          for ri, (s, v) in enumerate(chart_data, 1):
              ws3.cell(row=ri, column=2, value=s)
              ws3.cell(row=ri, column=3, value=v)

          bar = BarChart()
          bar.type   = "col"
          bar.title  = "Section 6 – Results by Status"
          bar.y_axis.title = "Number of Checks"
          bar.x_axis.title = "Status"
          bar.style  = 10
          bar.width  = 18
          bar.height = 12
          bar.add_data(Reference(ws3, min_col=3, max_col=3, min_row=1, max_row=5),
                       titles_from_data=True)
          bar.set_categories(Reference(ws3, min_col=2, max_col=2, min_row=2, max_row=5))
          ws3.add_chart(bar, "B2")

          pie = PieChart()
          pie.title  = "Pass / Fail / Warn / Info Split"
          pie.style  = 10
          pie.width  = 14
          pie.height = 12
          pie.add_data(Reference(ws3, min_col=3, max_col=3, min_row=1, max_row=5),
                       titles_from_data=True)
          pie.set_categories(Reference(ws3, min_col=2, max_col=2, min_row=2, max_row=5))
          ws3.add_chart(pie, "L2")

          wb.save(OUTPUT)
          print(f"Report saved: {OUTPUT}")

    # ── Step 3: Run script ───────────────────────────────────────────────
    - name: "Report | Generate Excel report"
      ansible.builtin.command: "python3 {{ python_script }}"
      register: excel_gen
      changed_when: false

    - name: "Report | Show generator output"
      ansible.builtin.debug:
        msg: "{{ excel_gen.stdout }}"

    # ── Step 4: Fetch both files back to controller ──────────────────────
    - name: "Report | Ensure local report folder exists on controller"
      ansible.builtin.file:
        path: "{{ report_base }}"
        state: directory
        mode: '0755'
      delegate_to: localhost
      become: false

    - name: "Report | Fetch JSON to controller"
      ansible.builtin.fetch:
        src: "{{ json_file }}"
        dest: "{{ report_base }}/{{ inventory_hostname }}_section6.json"
        flat: true

    - name: "Report | Fetch Excel to controller"
      ansible.builtin.fetch:
        src: "{{ report_file }}"
        dest: "{{ report_base }}/{{ inventory_hostname }}_section6.xlsx"
        flat: true

    # ── Step 5: Cleanup temp files ───────────────────────────────────────
    - name: "Report | Remove temp files from target"
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ python_script }}"
        - "{{ json_file }}"
        - "{{ report_file }}"

    # ── Console summary ───────────────────────────────────────────────────
    - name: "Report | Console summary"
      ansible.builtin.debug:
        msg: |
          ┌──────────────────────────────────────────────────────────────┐
          │   CIS Docker Benchmark – Section 6 Summary                   │
          ├───────────────┬──────────────────────────────────────────────┤
          │ Host          │ {{ ansible_hostname }}
          │ Total checks  │ {{ summary_total }}
          │ PASS          │ {{ summary_pass }}
          │ FAIL          │ {{ summary_fail }}
          │ WARN          │ {{ summary_warn }}
          │ INFO          │ {{ summary_info }}
          ├───────────────┴──────────────────────────────────────────────┤
          │ Excel → {{ report_base }}/{{ inventory_hostname }}_section6.xlsx
          │ JSON  → {{ report_base }}/{{ inventory_hostname }}_section6.json
          └──────────────────────────────────────────────────────────────┘
          {% for r in audit_results %}
          [{{ r.status }}] {{ r.id }} – {{ r.details | truncate(80) }}
          {% endfor %}