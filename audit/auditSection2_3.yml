    # ──────────────────────────────────────────────
    # 3.16 – daemon.json permissions (644)
    # ──────────────────────────────────────────────
    - name: "3.16 | Audit daemon.json permissions"
      ansible.builtin.stat:
        path: /etc/docker/daemon.json
      register: check_3_16_raw
      failed_when: false
      changed_when: false

    - name: "3.16 | Evaluate daemon.json permissions"
      set_fact:
        check_3_16:
          id: "3.16"
          section: "Section 3 - Docker Daemon Configuration Files"
          title: "Ensure that daemon.json file permissions are set to 644 or more restrictive"
          status: >-
            {{ 'SKIP' if not check_3_16_raw.stat.exists else
               'PASS' if check_3_16_raw.stat.mode in ['0644', '0600', '0444'] else
               'FAIL' }}
          details: >-
            {{ 'daemon.json does not exist.' if not check_3_16_raw.stat.exists else
               'daemon.json permissions are correct (644 or more restrictive).'
               if check_3_16_raw.stat.mode in ['0644', '0600', '0444'] else
               'daemon.json permissions are incorrect. Expected 644 or more restrictive. Current: ' ~ check_3_16_raw.stat.mode }}
          remediation: >-
            chmod 644 /etc/docker/daemon.json
          raw_output: >-
            {{ 'File does not exist' if not check_3_16_raw.stat.exists else
               check_3_16_raw.stat.mode }}

    - name: "3.16 | Append result"
      set_fact:
