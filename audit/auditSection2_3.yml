    # ──────────────────────────────────────────────
    # Summary counts
    # ──────────────────────────────────────────────
    - name: Compute summary statistics
      set_fact:
        summary_pass:  "{{ audit_results | selectattr('status', 'equalto', 'PASS') | list | length }}"
        summary_fail:  "{{ audit_results | selectattr('status', 'equalto', 'FAIL') | list | length }}"
        summary_skip:  "{{ audit_results | selectattr('status', 'equalto', 'SKIP') | list | length }}"
        summary_info:  "{{ audit_results | selectattr('status', 'equalto', 'INFO') | list | length }}"
        summary_total: "{{ audit_results | length }}"

    # ══════════════════════════════════════════════
    # KEY FIX: write ALL audit data to a JSON file.
    # The Python script reads this file directly —
    # no data is ever interpolated into Python source.
    # This sidesteps every quoting / escaping issue.
    # ══════════════════════════════════════════════
    - name: Write audit data to JSON file on target
      copy:
        dest: "{{ data_file }}"
        mode: '0600'
        content: "{{ {'meta': {'host': ansible_hostname,
                               'docker_ver': docker_version.stdout | default('unknown'),
                               'os': ansible_distribution ~ ' ' ~ ansible_distribution_version,
                               'generated': ansible_date_time.iso8601,
                               'pass': summary_pass | int,
                               'fail': summary_fail | int,
                               'skip': summary_skip | int,
                               'info': summary_info | int,
                               'total': summary_total | int},
                      'results': audit_results} | to_nice_json }}"

    # ──────────────────────────────────────────────
    # Write the Python script for Excel generation
    # ──────────────────────────────────────────────
    - name: Write Excel report generator script
      copy:
        dest: "{{ python_script }}"
        mode: '0700'
        content: |
          #!/usr/bin/env python3
          import json
          from openpyxl import Workbook
          from openpyxl.styles import Font, PatternFill, Alignment, Border, Side
          from openpyxl.chart import BarChart, Reference

          DATA_FILE = "{{ data_file }}"
          OUTPUT    = "{{ report_file }}"

          with open(DATA_FILE) as fh:
              payload = json.load(fh)

          META          = payload["meta"]
          AUDIT_RESULTS = payload["results"]

          P = dict(
              TITLE_BG="0F3460", HEADER_BG="1F2D3D", HEADER_FG="FFFFFF",
              PASS_BG="D6F4DC",  PASS_FG="1A6E2E",
              FAIL_BG="FAD7D5",  FAIL_FG="9C2B26",
              SKIP_BG="E8E8E8",  SKIP_FG="555555",
              INFO_BG="D0E8FF",  INFO_FG="1A4E8A",
              ROW_ALT="F6F8FA",  BORDER="BFC9D4",
          )
          STATUS_MAP = {
              "PASS": (P["PASS_BG"], P["PASS_FG"], "PASS"),
              "FAIL": (P["FAIL_BG"], P["FAIL_FG"], "FAIL"),
              "SKIP": (P["SKIP_BG"], P["SKIP_FG"], "SKIP"),
              "INFO": (P["INFO_BG"], P["INFO_FG"], "INFO"),
          }

          def fill(c):
              return PatternFill("solid", fgColor=c)

          def bdr(c=None):
              s = Side(style="thin", color=c or P["BORDER"])
              return Border(left=s, right=s, top=s, bottom=s)

          def font(bold=False, size=10, color="000000", italic=False):
              return Font(name="Arial", bold=bold, size=size, color=color, italic=italic)

          def align(h="left", v="top", wrap=True):
              return Alignment(horizontal=h, vertical=v, wrap_text=wrap)

          def safe(v):
              return v if isinstance(v, (str, int, float, bool, type(None))) else json.dumps(v)

          wb = Workbook()
          # ════════════════════════════════════════════════════════════════
          # Sheet 1 – SUMMARY
          # ════════════════════════════════════════════════════════════════
          ws = wb.active
          ws.title = "Summary"
          ws.sheet_view.showGridLines = False
          ws.column_dimensions["A"].width = 2

          # Title
          ws.merge_cells("B1:J2")
          c = ws["B1"]
          c.value     = "Docker CIS Benchmark Audit  -  Sections 2 & 3"
          c.font      = font(bold=True, size=20, color=P["HEADER_FG"])
          c.fill      = fill(P["TITLE_BG"])
          c.alignment = align("left", "center", wrap=False)
          ws.row_dimensions[1].height = 20
          ws.row_dimensions[2].height = 22

          # Subtitle
          ws.merge_cells("B3:J3")
          c = ws["B3"]
          c.value = (f"Daemon Configuration & Files  |  Host: {META['host']}"
                     f"  |  Docker: {META['docker_ver']}"
                     f"  |  OS: {META['os']}"
                     f"  |  {META['generated']}")
          c.font      = font(size=9, color="AAAAAA", italic=True)
          c.fill      = fill(P["TITLE_BG"])
          c.alignment = align("left", "center", wrap=False)
          ws.row_dimensions[3].height = 16
          ws.row_dimensions[4].height = 12

          # Stat cards
          cards = [
              ("B","C", "TOTAL CHECKS", META["total"], P["HEADER_BG"], P["HEADER_FG"]),
              ("D","E", "PASSED",       META["pass"],  P["PASS_BG"],   P["PASS_FG"]),
              ("F","G", "FAILED",       META["fail"],  P["FAIL_BG"],   P["FAIL_FG"]),
              ("H","I", "INFO / SKIP",  META["info"]+META["skip"], P["INFO_BG"], P["INFO_FG"]),
          ]
          for c1, c2, label, val, _bg, fg in cards:
              ws.merge_cells(f"{c1}5:{c2}5")
              lc = ws[f"{c1}5"]
              lc.value = label
              lc.font  = font(bold=True, size=9, color="555555")
              lc.fill  = fill("EAECEF")
              lc.alignment = align("center", "center", wrap=False)
              lc.border = bdr()
              ws.merge_cells(f"{c1}6:{c2}6")
              vc = ws[f"{c1}6"]
              vc.value = val
              vc.font  = font(bold=True, size=30, color=fg)
              vc.fill  = fill("FFFFFF")
              vc.alignment = align("center", "center", wrap=False)
              vc.border = bdr()
          ws.row_dimensions[5].height = 20
          ws.row_dimensions[6].height = 46

          total = META["total"] or 1
          pct   = round(META["pass"] / total * 100, 1)
          bar   = chr(9608) * int(pct/5) + chr(9617) * (20 - int(pct/5))
          ws.merge_cells("B8:J8")
          bc = ws["B8"]
          bc.value = f"  Compliance:  {bar}  {pct}%  ({META['pass']} / {META['total']} passed)"
          bc.font  = font(bold=True, size=11, color=P["PASS_FG"] if pct >= 80 else P["FAIL_FG"])
          bc.fill  = fill("EAF4EA" if pct >= 80 else "FAE8E8")
          bc.alignment = align("left", "center", wrap=False)
          bc.border = bdr()
          ws.row_dimensions[8].height = 28

          spans = {"B":("B","C"), "D":("D","E"), "F":("F","F"), "G":("G","J")}
          HDR   = 10
          for col, hdr in zip(["B","D","F","G"], ["Check ID","Title","Status","Details"]):
              c1, c2 = spans[col]
              ws.merge_cells(f"{c1}{HDR}:{c2}{HDR}")
              cell = ws[f"{col}{HDR}"]
              cell.value = hdr
              cell.font = font(bold=True, size=10, color=P["HEADER_FG"])
              cell.fill = fill(P["HEADER_BG"])
              cell.alignment = align("center", "center", wrap=False)
              cell.border = bdr()
          ws.row_dimensions[HDR].height = 22

          for i, result in enumerate(AUDIT_RESULTS):
              r  = HDR + 1 + i
              bg = "FFFFFF" if i % 2 == 0 else P["ROW_ALT"]
              sbg, sfg, slabel = STATUS_MAP.get(result["status"], (P["SKIP_BG"], P["SKIP_FG"], result["status"]))
              row = {"B": result["id"], "D": result["title"], "F": slabel, "G": result["details"]}
              for col, val in row.items():
                  c1, c2 = spans[col]
                  ws.merge_cells(f"{c1}{r}:{c2}{r}")
                  cell = ws[f"{col}{r}"]
                  cell.value = safe(val)
                  cell.border = bdr()
                  cell.alignment = align("center" if col in ("B","F") else "left", "center")
                  if col == "F":
                      cell.font = font(bold=True, color=sfg)
                      cell.fill = fill(sbg)
                  else:
                      cell.font = font()
                      cell.fill = fill(bg)
              ws.row_dimensions[r].height = 26

          # ════════════════════════════════════════════════════════════════
          # Sheet 2 – DETAILED RESULTS
          # ════════════════════════════════════════════════════════════════
          ws2 = wb.create_sheet("Detailed Results")
          ws2.sheet_view.showGridLines = False
          ws2.column_dimensions["A"].width = 2

          det_cols = [
              ("B","Check ID",10),("C","Section",28),("D","Title",36),
              ("E","Status",13),("F","Details",42),("G","Remediation",42),
              ("H","Raw Output",38),
          ]
          for col, label, width in det_cols:
              c = ws2[f"{col}1"]
              c.value     = label
              c.font      = font(bold=True, size=10, color=P["HEADER_FG"])
              c.fill      = fill(P["HEADER_BG"])
              c.alignment = align("center", "center", wrap=False)
              c.border    = bdr()
              ws2.column_dimensions[col].width = width
          ws2.row_dimensions[1].height = 22

          for i, result in enumerate(AUDIT_RESULTS):
              r  = i + 2
              bg = "FFFFFF" if i % 2 == 0 else P["ROW_ALT"]
              sbg, sfg, slabel = STATUS_MAP.get(
                  result["status"], (P["SKIP_BG"], P["SKIP_FG"], result["status"]))
              det = {
                  "B": result["id"],          "C": result["section"],
                  "D": result["title"],       "E": slabel,
                  "F": result["details"],     "G": result["remediation"],
                  "H": result["raw_output"],
              }
              for col, val in det.items():
                  cell = ws2[f"{col}{r}"]
                  cell.value     = safe(val)
                  cell.border    = bdr()
                  cell.alignment = align("center" if col in ("B","E") else "left", "top")
                  if col == "E":
                      cell.font = font(bold=True, color=sfg)
                      cell.fill = fill(sbg)
                  else:
                      cell.font = font()
                      cell.fill = fill(bg)
              ws2.row_dimensions[r].height = 44

          ws2.freeze_panes = "B2"
          ws2.auto_filter.ref = f"B1:H{len(AUDIT_RESULTS)+1}"

          # ════════════════════════════════════════════════════════════════
          # Sheet 3 – CHART
          # ════════════════════════════════════════════════════════════════
          ws3 = wb.create_sheet("Chart")
          ws3.sheet_view.showGridLines = False
          ws3.column_dimensions["A"].width = 2

          for ri, (s, v) in enumerate([("Status","Count"),
                                        ("PASS", META["pass"]),
                                        ("FAIL", META["fail"]),
                                        ("SKIP", META["skip"]),
                                        ("INFO", META["info"])], 1):
              ws3.cell(row=ri, column=2, value=s)
              ws3.cell(row=ri, column=3, value=v)

          chart = BarChart()
          chart.type   = "col"
          chart.title  = "Sections 2 & 3 - Audit Results by Status"
          chart.y_axis.title = "Number of Checks"
          chart.x_axis.title = "Status"
          chart.style  = 10
          chart.width  = 20
          chart.height = 14
          chart.add_data(Reference(ws3, min_col=3, max_col=3, min_row=1, max_row=5),
                         titles_from_data=True)
          chart.set_categories(Reference(ws3, min_col=2, max_col=2, min_row=2, max_row=5))
          ws3.add_chart(chart, "B2")

          wb.save(OUTPUT)
          print(f"Report saved: {OUTPUT}")

    # ──────────────────────────────────────────────
    # Run the Python script on the target host
    # ──────────────────────────────────────────────
    - name: Generate Excel report
      command: "python3 {{ python_script }}"
      register: excel_gen
      changed_when: false

    - name: Show generator output
      debug:
        msg: "{{ excel_gen.stdout }}"

    # ──────────────────────────────────────────────
    # Fetch Excel report to controller
    # ──────────────────────────────────────────────
    - name: Fetch Excel report to controller
      fetch:
        src: "{{ report_file }}"
        dest: "./docker_benchmark_reports/{{ inventory_hostname }}_section2_3.xlsx"
        flat: true

    - name: Fetch JSON data to controller
      fetch:
        src: "{{ data_file }}"
        dest: "./docker_benchmark_reports/{{ inventory_hostname }}_section2_3.json"
        flat: true

    # ──────────────────────────────────────────────
    # Cleanup temp files from target
    # ──────────────────────────────────────────────
    - name: Remove temp files from target
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ python_script }}"
        - "{{ data_file }}"

    # ──────────────────────────────────────────────
    # Console summary
    # ──────────────────────────────────────────────
    - name: Print audit summary
      debug:
        msg: |
          ┌──────────────────────────────────────────────────┐
          │   Docker CIS Benchmark - Sections 2 & 3 Summary  │
          ├───────────────┬──────────────────────────────────┤
          │ Host          │ {{ ansible_hostname }}
          │ Docker ver    │ {{ docker_version.stdout | default('unknown') }}
          │ Total checks  │ {{ summary_total }}
          │ PASS          │ {{ summary_pass }}
          │ FAIL          │ {{ summary_fail }}
          │ SKIP          │ {{ summary_skip }}
          │ INFO          │ {{ summary_info }}
          │ Excel report  │ {{ report_file }}
          └──────────────────────────────────────────────────┘
          {% for result in audit_results %}
          [{{ result.status }}] {{ result.id }} - {{ result.title }}
             {{ result.details }}
          {% endfor %}
