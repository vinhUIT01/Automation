---
- name: "CIS Docker Benchmark v1.8.0 - Audit Section 2 & 3 (Excel Report)"
  hosts: docker
  become: true
  gather_facts: true
  vars:
    report_dir: /tmp/docker_benchmark
    report_file: "{{ report_dir }}/docker_benchmark_section2_3.xlsx"
    data_file: "{{ report_dir }}/audit_data_section2_3.json"
    python_script: "{{ report_dir }}/generate_report_2_3.py"
    audit_results: []

  tasks:
    # ──────────────────────────────────────────────
    # Pre-flight
    # ──────────────────────────────────────────────
    - name: Create report directory
      file:
        path: "{{ report_dir }}"
        state: directory
        mode: '0755'

    - name: Ensure openpyxl is installed on target
      pip:
        name: openpyxl
        state: present
      failed_when: false

    - name: Get Docker version
      command: docker version --format '{{ '{{' }}.Server.Version{{ '}}' }}'
      register: docker_version
      changed_when: false
      failed_when: false

    # ──────────────────────────────────────────────
    # SECTION 2: Docker Daemon Configuration
    # ──────────────────────────────────────────────

    # ──────────────────────────────────────────────
    # 2.1 – Run Docker daemon as non-root user (Manual)
    # ──────────────────────────────────────────────
    - name: "2.1 | Evaluate Docker daemon running as non-root"
      set_fact:
        check_2_1:
          id: "2.1"
          section: "Section 2 - Docker Daemon Configuration"
          title: "Run the Docker daemon as a non-root user, if possible"
          status: "INFO"
          details: >-
            Manual check required. Verify if Docker is running as non-root user.
            Standard Docker installations run as root. Rootless mode requires manual setup.
          remediation: >-
            Consider rootless Docker installation: https://docs.docker.com/engine/security/rootless/
          raw_output: "Manual check - review with: ps -ef | grep dockerd"

    - name: "2.1 | Append result"
      set_fact:
        audit_results: "{{ audit_results + [check_2_1] }}"

    # ──────────────────────────────────────────────
    # 2.2 – Restrict network traffic between containers
    # ──────────────────────────────────────────────
    - name: "2.2 | Audit inter-container communication setting"
      ansible.builtin.shell: |
        grep -E '"icc":\s*false' /etc/docker/daemon.json
      register: check_2_2_raw
      failed_when: false
      changed_when: false

    - name: "2.2 | Evaluate inter-container communication"
      set_fact:
        check_2_2:
          id: "2.2"
          section: "Section 2 - Docker Daemon Configuration"
          title: "Ensure network traffic is restricted between containers on the default bridge"
          status: >-
            {{ 'PASS' if check_2_2_raw.rc == 0 else 'FAIL' }}
          details: >-
            {{ 'ICC (inter-container communication) is disabled.'
               if check_2_2_raw.rc == 0 else
               'ICC is NOT disabled. Containers can communicate freely on the default bridge.' }}
          remediation: >-
            Add "icc": false to /etc/docker/daemon.json and restart Docker.
          raw_output: "{{ check_2_2_raw.stdout | default('N/A') | string }}"

    - name: "2.2 | Append result"
      set_fact:
        audit_results: "{{ audit_results + [check_2_2] }}"

    # ──────────────────────────────────────────────
    # 2.3 – Logging level set to 'info'
    # ──────────────────────────────────────────────
    - name: "2.3 | Audit logging level configuration"
      ansible.builtin.shell: |
        grep -E '"log-level":\s*"info"' /etc/docker/daemon.json
      register: check_2_3_raw
      failed_when: false
      changed_when: false

    - name: "2.3 | Evaluate logging level"
      set_fact:
        check_2_3:
          id: "2.3"
          section: "Section 2 - Docker Daemon Configuration"
          title: "Ensure the logging level is set to 'info'"
          status: >-
            {{ 'PASS' if check_2_3_raw.rc == 0 else 'FAIL' }}
          details: >-
            {{ 'Logging level is set to info.'
               if check_2_3_raw.rc == 0 else
               'Logging level is NOT set to info. Default may be too verbose or not verbose enough.' }}
          remediation: >-
            Add "log-level": "info" to /etc/docker/daemon.json
          raw_output: "{{ check_2_3_raw.stdout | default('N/A') | string }}"

    - name: "2.3 | Append result"
      set_fact:
        audit_results: "{{ audit_results + [check_2_3] }}"

    # ──────────────────────────────────────────────
    # 2.4 – Docker allowed to make changes to iptables
    # ──────────────────────────────────────────────
    - name: "2.4 | Audit iptables configuration"
      ansible.builtin.shell: |
        grep -E '"iptables":\s*true' /etc/docker/daemon.json || echo "INFO: Default is true"
      register: check_2_4_raw
      failed_when: false
      changed_when: false

    - name: "2.4 | Evaluate iptables configuration"
      set_fact:
        check_2_4:
          id: "2.4"
          section: "Section 2 - Docker Daemon Configuration"
          title: "Ensure Docker is allowed to make changes to iptables"
          status: >-
            {{ 'PASS' if check_2_4_raw.rc == 0 or check_2_4_raw.stdout == 'INFO: Default is true' else 'FAIL' }}
          details: >-
            {{ 'Docker is configured to manage iptables.'
               if check_2_4_raw.rc == 0 or check_2_4_raw.stdout == 'INFO: Default is true' else
               'iptables management is disabled. Docker cannot set up network rules properly.' }}
          remediation: >-
            Add "iptables": true to /etc/docker/daemon.json
          raw_output: "{{ check_2_4_raw.stdout | default('N/A') | string }}"

    - name: "2.4 | Append result"
      set_fact:
        audit_results: "{{ audit_results + [check_2_4] }}"

    # ──────────────────────────────────────────────
    # 2.5 – Insecure registries not used
    # ──────────────────────────────────────────────
    - name: "2.5 | Audit insecure registries configuration"
      ansible.builtin.shell: |
        grep -E '"insecure-registries":\s*\[\]' /etc/docker/daemon.json || \
        grep -v '"insecure-registries"' /etc/docker/daemon.json > /dev/null 2>&1 && echo "PASS"
      register: check_2_5_raw
      failed_when: false
      changed_when: false

    - name: "2.5 | Evaluate insecure registries"
      set_fact:
        check_2_5:
          id: "2.5"
          section: "Section 2 - Docker Daemon Configuration"
          title: "Ensure insecure registries are not used"
          status: >-
            {{ 'PASS' if check_2_5_raw.rc == 0 else 'FAIL' }}
          details: >-
            {{ 'No insecure registries configured.'
               if check_2_5_raw.rc == 0 else
               'Insecure registries are configured. This allows unencrypted image pulls.' }}
          remediation: >-
            Remove insecure registries from /etc/docker/daemon.json or set to empty array: []
          raw_output: "{{ check_2_5_raw.stdout | default('N/A') | string }}"

    - name: "2.5 | Append result"
      set_fact:
        audit_results: "{{ audit_results + [check_2_5] }}"

    # ──────────────────────────────────────────────
    # 2.6 – aufs storage driver not used
    # ──────────────────────────────────────────────
    - name: "2.6 | Audit storage driver"
      command: docker info --format '{{ '{{' }}.Driver{{ '}}' }}'
      register: check_2_6_raw
      changed_when: false
      failed_when: false

    - name: "2.6 | Evaluate aufs storage driver"
      set_fact:
        check_2_6:
          id: "2.6"
          section: "Section 2 - Docker Daemon Configuration"
          title: "Ensure aufs storage driver is not used"
          status: >-
            {{ 'PASS' if check_2_6_raw.stdout != 'aufs' else 'FAIL' }}
          details: >-
            {{ 'Storage driver is ' ~ check_2_6_raw.stdout ~ ' (not aufs).'
               if check_2_6_raw.stdout != 'aufs' else
               'aufs storage driver is in use. This driver is deprecated.' }}
          remediation: >-
            Change storage driver to overlay2 in /etc/docker/daemon.json:
            {"storage-driver": "overlay2"}
          raw_output: "{{ check_2_6_raw.stdout | default('N/A') | string }}"

    - name: "2.6 | Append result"
      set_fact:
        audit_results: "{{ audit_results + [check_2_6] }}"

    # ──────────────────────────────────────────────
    # 2.7 – devicemapper storage driver not used
    # ──────────────────────────────────────────────
    - name: "2.7 | Evaluate devicemapper storage driver"
      set_fact:
        check_2_7:
          id: "2.7"
          section: "Section 2 - Docker Daemon Configuration"
          title: "Ensure devicemapper storage driver is not used"
          status: >-
            {{ 'PASS' if check_2_6_raw.stdout != 'devicemapper' else 'FAIL' }}
          details: >-
            {{ 'Storage driver is ' ~ check_2_6_raw.stdout ~ ' (not devicemapper).'
               if check_2_6_raw.stdout != 'devicemapper' else
               'devicemapper storage driver is in use. This driver is deprecated.' }}
          remediation: >-
            Change storage driver to overlay2 in /etc/docker/daemon.json:
            {"storage-driver": "overlay2"}
          raw_output: "{{ check_2_6_raw.stdout | default('N/A') | string }}"

    - name: "2.7 | Append result"
      set_fact:
        audit_results: "{{ audit_results + [check_2_7] }}"

    # ──────────────────────────────────────────────
    # 2.8 – TLS authentication for Docker daemon
    # ──────────────────────────────────────────────
    - name: "2.8 | Audit TLS authentication configuration"
      ansible.builtin.shell: |
        grep -E '"tls":\s*true' /etc/docker/daemon.json && \
        grep -E '"tlsverify":\s*true' /etc/docker/daemon.json
      register: check_2_8_raw
      failed_when: false
      changed_when: false

    - name: "2.8 | Evaluate TLS authentication"
      set_fact:
        check_2_8:
          id: "2.8"
          section: "Section 2 - Docker Daemon Configuration"
          title: "Ensure TLS authentication for Docker daemon is configured"
          status: >-
            {{ 'PASS' if check_2_8_raw.rc == 0 else 'FAIL' }}
          details: >-
            {{ 'TLS authentication is enabled with tls and tlsverify configured.'
               if check_2_8_raw.rc == 0 else
               'TLS authentication is NOT configured. Docker API communications may be unencrypted.' }}
          remediation: >-
            Configure TLS in /etc/docker/daemon.json with "tls": true and "tlsverify": true.
            Ensure CA, server cert, and server key paths are correctly specified.
          raw_output: "{{ check_2_8_raw.stdout | default('N/A') | string }}"

    - name: "2.8 | Append result"
      set_fact:
        audit_results: "{{ audit_results + [check_2_8] }}"

    # ──────────────────────────────────────────────
    # 2.9 – Default ulimit configured appropriately
    # ──────────────────────────────────────────────
    - name: "2.9 | Audit default ulimit configuration"
      ansible.builtin.shell: |
        grep -E '"default-ulimits":\s*\{' /etc/docker/daemon.json
      register: check_2_9_raw
      failed_when: false
      changed_when: false

    - name: "2.9 | Evaluate default ulimit"
      set_fact:
        check_2_9:
          id: "2.9"
          section: "Section 2 - Docker Daemon Configuration"
          title: "Ensure the default ulimit is configured appropriately"
          status: >-
            {{ 'PASS' if check_2_9_raw.rc == 0 else 'FAIL' }}
          details: >-
            {{ 'Default ulimits are configured in daemon.json.'
               if check_2_9_raw.rc == 0 else
               'Default ulimits are NOT configured. Containers may exhaust system resources.' }}
          remediation: >-
            Configure default ulimits in /etc/docker/daemon.json:
            {"default-ulimits": {"nofile": {"Hard": 64000, "Name": "nofile", "Soft": 64000}}}
          raw_output: "{{ check_2_9_raw.stdout | default('N/A') | string }}"

    - name: "2.9 | Append result"
      set_fact:
        audit_results: "{{ audit_results + [check_2_9] }}"

    # ──────────────────────────────────────────────
    # 2.10 – User namespace support enabled
    # ──────────────────────────────────────────────
    - name: "2.10 | Audit user namespace remapping"
      ansible.builtin.shell: |
        grep -E '"userns-remap":\s*"default"' /etc/docker/daemon.json && \
        [ -f /etc/subuid ] && [ -f /etc/subgid ]
      register: check_2_10_raw
      failed_when: false
      changed_when: false

    - name: "2.10 | Evaluate user namespace support"
      set_fact:
        check_2_10:
          id: "2.10"
          section: "Section 2 - Docker Daemon Configuration"
          title: "Enable user namespace support"
          status: >-
            {{ 'PASS' if check_2_10_raw.rc == 0 else 'FAIL' }}
          details: >-
            {{ 'User namespace remapping is enabled with default profile.'
               if check_2_10_raw.rc == 0 else
               'User namespace remapping is NOT enabled. Container processes run with same UIDs as host.' }}
          remediation: >-
            Add "userns-remap": "default" to /etc/docker/daemon.json and restart Docker.
            Ensure /etc/subuid and /etc/subgid files exist with dockremap entries.
          raw_output: "{{ check_2_10_raw.stdout | default('N/A') | string }}"

    - name: "2.10 | Append result"
      set_fact:
        audit_results: "{{ audit_results + [check_2_10] }}"

    # ──────────────────────────────────────────────
    # 2.11 – Default cgroup usage confirmed
    # ──────────────────────────────────────────────
    - name: "2.11 | Audit cgroup configuration"
      ansible.builtin.shell: |
        docker info --format '{{ '{{' }}.CgroupDriver{{ '}}' }}' 2>/dev/null || echo "INFO"
      register: check_2_11_raw
      failed_when: false
      changed_when: false

    - name: "2.11 | Evaluate cgroup usage"
      set_fact:
        check_2_11:
          id: "2.11"
          section: "Section 2 - Docker Daemon Configuration"
          title: "Ensure the default cgroup usage has been confirmed"
          status: "INFO"
          details: >-
            {{ 'Cgroup driver: ' ~ check_2_11_raw.stdout
               if check_2_11_raw.stdout != 'INFO' else
               'Review cgroup configuration. Default cgroup usage should be confirmed.' }}
          remediation: >-
            Review cgroup driver configuration. Use cgroupfs or systemd consistently.
          raw_output: "{{ check_2_11_raw.stdout | default('N/A') | string }}"

    - name: "2.11 | Append result"
      set_fact:
        audit_results: "{{ audit_results + [check_2_11] }}"

    # ──────────────────────────────────────────────
    # 2.12 – Base device size not changed until needed
    # ──────────────────────────────────────────────
    - name: "2.12 | Audit base device size configuration"
      ansible.builtin.shell: |
        grep -E '"storage-opts":' /etc/docker/daemon.json | grep -i 'basesize' || echo "PASS: No custom base size"
      register: check_2_12_raw
      failed_when: false
      changed_when: false

    - name: "2.12 | Evaluate base device size"
      set_fact:
        check_2_12:
          id: "2.12"
          section: "Section 2 - Docker Daemon Configuration"
          title: "Ensure base device size is not changed until needed"
          status: >-
            {{ 'PASS' if check_2_12_raw.stdout == 'PASS: No custom base size' else 'INFO' }}
          details: >-
            {{ check_2_12_raw.stdout }}
          remediation: >-
            Do not set dm.basesize unless required. Default is sufficient for most use cases.
          raw_output: "{{ check_2_12_raw.stdout | default('N/A') | string }}"

    - name: "2.12 | Append result"
      set_fact:
        audit_results: "{{ audit_results + [check_2_12] }}"

    # ──────────────────────────────────────────────
    # 2.13 – Authorization for Docker client commands enabled
    # ──────────────────────────────────────────────
    - name: "2.13 | Audit authorization plugins configuration"
      ansible.builtin.shell: |
        grep -E '"authorization-plugins":\s*\[' /etc/docker/daemon.json
      register: check_2_13_raw
      failed_when: false
      changed_when: false

    - name: "2.13 | Evaluate authorization plugins"
      set_fact:
        check_2_13:
          id: "2.13"
          section: "Section 2 - Docker Daemon Configuration"
          title: "Ensure that authorization for Docker client commands is enabled"
          status: >-
            {{ 'PASS' if check_2_13_raw.rc == 0 else 'FAIL' }}
          details: >-
            {{ 'Authorization plugins are configured in daemon.json.'
               if check_2_13_raw.rc == 0 else
               'Authorization plugins are NOT configured. Docker commands are not audited/controlled.' }}
          remediation: >-
            Add authorization plugins to /etc/docker/daemon.json:
            {"authorization-plugins": ["openpolicyagent/opa-docker-authz"]}
          raw_output: "{{ check_2_13_raw.stdout | default('N/A') | string }}"

    - name: "2.13 | Append result"
      set_fact:
        audit_results: "{{ audit_results + [check_2_13] }}"

    # ──────────────────────────────────────────────
    # 2.14 – Centralized and remote logging configured
    # ──────────────────────────────────────────────
    - name: "2.14 | Audit centralized logging configuration"
      ansible.builtin.shell: |
        grep -E '"log-driver":\s*"(syslog|journald|fluentd|awslogs)"' /etc/docker/daemon.json
      register: check_2_14_raw
      failed_when: false
      changed_when: false

    - name: "2.14 | Evaluate centralized logging"
      set_fact:
        check_2_14:
          id: "2.14"
          section: "Section 2 - Docker Daemon Configuration"
          title: "Ensure centralized and remote logging is configured"
          status: >-
            {{ 'PASS' if check_2_14_raw.rc == 0 else 'FAIL' }}
          details: >-
            {{ 'Centralized logging driver is configured.'
               if check_2_14_raw.rc == 0 else
               'Centralized logging is NOT configured. Logs may be lost if host fails.' }}
          remediation: >-
            Configure a centralized logging driver in /etc/docker/daemon.json:
            {"log-driver": "syslog", "log-opts": {"syslog-address": "tcp://192.168.0.42:12345"}}
          raw_output: "{{ check_2_14_raw.stdout | default('N/A') | string }}"

    - name: "2.14 | Append result"
      set_fact:
        audit_results: "{{ audit_results + [check_2_14] }}"

    # ──────────────────────────────────────────────
    # 2.15 – Containers restricted from acquiring new privileges
    # ──────────────────────────────────────────────
    - name: "2.15 | Audit no-new-privileges configuration"
      ansible.builtin.shell: |
        grep -E '"no-new-privileges":\s*true' /etc/docker/daemon.json
      register: check_2_15_raw
      failed_when: false
      changed_when: false

    - name: "2.15 | Evaluate no-new-privileges"
      set_fact:
        check_2_15:
          id: "2.15"
          section: "Section 2 - Docker Daemon Configuration"
          title: "Ensure containers are restricted from acquiring new privileges"
          status: >-
            {{ 'PASS' if check_2_15_raw.rc == 0 else 'FAIL' }}
          details: >-
            {{ 'no-new-privileges is set to true in daemon.json.'
               if check_2_15_raw.rc == 0 else
               'no-new-privileges is NOT set. Containers can escalate privileges via setuid binaries.' }}
          remediation: >-
            Add "no-new-privileges": true to /etc/docker/daemon.json
          raw_output: "{{ check_2_15_raw.stdout | default('N/A') | string }}"

    - name: "2.15 | Append result"
      set_fact:
        audit_results: "{{ audit_results + [check_2_15] }}"

    # ──────────────────────────────────────────────
    # 2.16 – Live restore enabled
    # ──────────────────────────────────────────────
    - name: "2.16 | Audit live restore configuration"
      ansible.builtin.shell: |
        grep -E '"live-restore":\s*true' /etc/docker/daemon.json
      register: check_2_16_raw
      failed_when: false
      changed_when: false

    - name: "2.16 | Evaluate live restore"
      set_fact:
        check_2_16:
          id: "2.16"
          section: "Section 2 - Docker Daemon Configuration"
          title: "Ensure live restore is enabled"
          status: >-
            {{ 'PASS' if check_2_16_raw.rc == 0 else 'FAIL' }}
          details: >-
            {{ 'Live restore is enabled. Containers survive Docker daemon restarts.'
               if check_2_16_raw.rc == 0 else
               'Live restore is NOT enabled. Containers stop when Docker daemon restarts.' }}
          remediation: >-
            Add "live-restore": true to /etc/docker/daemon.json
          raw_output: "{{ check_2_16_raw.stdout | default('N/A') | string }}"

    - name: "2.16 | Append result"
      set_fact:
        audit_results: "{{ audit_results + [check_2_16] }}"

    # ──────────────────────────────────────────────
    # 2.17 – Userland Proxy Disabled
    # ──────────────────────────────────────────────
    - name: "2.17 | Audit userland proxy configuration"
      ansible.builtin.shell: |
        grep -E '"userland-proxy":\s*false' /etc/docker/daemon.json
      register: check_2_17_raw
      failed_when: false
      changed_when: false

    - name: "2.17 | Evaluate userland proxy"
      set_fact:
        check_2_17:
          id: "2.17"
          section: "Section 2 - Docker Daemon Configuration"
          title: "Ensure Userland Proxy is Disabled"
          status: >-
            {{ 'PASS' if check_2_17_raw.rc == 0 else 'FAIL' }}
          details: >-
            {{ 'Userland proxy is disabled. Docker uses kernel NAT for better performance.'
               if check_2_17_raw.rc == 0 else
               'Userland proxy is enabled. This can cause performance issues and port conflicts.' }}
          remediation: >-
            Add "userland-proxy": false to /etc/docker/daemon.json
          raw_output: "{{ check_2_17_raw.stdout | default('N/A') | string }}"

    - name: "2.17 | Append result"
      set_fact:
        audit_results: "{{ audit_results + [check_2_17] }}"

    # ──────────────────────────────────────────────
    # 2.18 – Daemon-wide custom seccomp profile (if appropriate)
    # ──────────────────────────────────────────────
    - name: "2.18 | Audit seccomp profile configuration"
      ansible.builtin.shell: |
        grep -E '"seccomp-profile":' /etc/docker/daemon.json || echo "INFO: Using default seccomp profile"
      register: check_2_18_raw
      failed_when: false
      changed_when: false

    - name: "2.18 | Evaluate seccomp profile"
      set_fact:
        check_2_18:
          id: "2.18"
          section: "Section 2 - Docker Daemon Configuration"
          title: "Ensure that a daemon-wide custom seccomp profile is applied if appropriate"
          status: "INFO"
          details: >-
            {{ check_2_18_raw.stdout }}
          remediation: >-
            If custom seccomp is needed, configure in daemon.json:
            {"seccomp-profile": "/etc/docker/seccomp/profile.json"}
          raw_output: "{{ check_2_18_raw.stdout | default('N/A') | string }}"

    - name: "2.18 | Append result"
      set_fact:
        audit_results: "{{ audit_results + [check_2_18] }}"

    # ──────────────────────────────────────────────
    # 2.19 – Experimental features not implemented in production
    # ──────────────────────────────────────────────
    - name: "2.19 | Audit experimental features"
      ansible.builtin.shell: |
        grep -E '"experimental":\s*true' /etc/docker/daemon.json || echo "PASS"
      register: check_2_19_raw
      failed_when: false
      changed_when: false

    - name: "2.19 | Evaluate experimental features"
      set_fact:
        check_2_19:
          id: "2.19"
          section: "Section 2 - Docker Daemon Configuration"
          title: "Ensure that experimental features are not implemented in production"
          status: >-
            {{ 'PASS' if check_2_19_raw.stdout == 'PASS' else 'FAIL' }}
          details: >-
            {{ 'Experimental features are NOT enabled.'
               if check_2_19_raw.stdout == 'PASS' else
               'Experimental features ARE enabled. This is not recommended for production.' }}
          remediation: >-
            Remove or set "experimental": false in /etc/docker/daemon.json
          raw_output: "{{ check_2_19_raw.stdout | default('N/A') | string }}"

    - name: "2.19 | Append result"
      set_fact:
        audit_results: "{{ audit_results + [check_2_19] }}"

    # ──────────────────────────────────────────────
    # SECTION 3: Docker Daemon Configuration Files
    # ──────────────────────────────────────────────

    # ──────────────────────────────────────────────
    # 3.1 – docker.service file ownership (root:root)
    # ──────────────────────────────────────────────
    - name: "3.1 | Audit docker.service file ownership"
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /usr/lib/systemd/system/docker.service
        - /etc/systemd/system/docker.service
        - /lib/systemd/system/docker.service
      register: check_3_1_raw
      failed_when: false
      changed_when: false

    - name: "3.1 | Evaluate docker.service ownership"
      set_fact:
