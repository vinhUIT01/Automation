                     else '[FAIL] 1.1.8 - Auditing is not configured for containerd.sock'))
        }] }}"

    - name: 1.1.9 Ensure auditing is configured for Docker files and directories - docker.socket
      ansible.builtin.systemd_service:
        name: docker.socket
      register: docker_socket_command

    - name: Check docker.socket file exists
      ansible.builtin.assert:
        that:
          - docker_socket_command.status.FragmentPath != ""
        fail_msg: "[INFO] 1.1.9 - Docker.socket does not exist"
      failed_when: false

    - name: Read file content
      ansible.builtin.slurp:
        src: "{{ docker_socket_command.status.FragmentPath }}"
      register: fragment_path_base64

    - name: Look for path
      ansible.builtin.set_fact:
        docker_socket_path: >-
          {{ fragment_path_base64.content | b64decode
          | regex_search('^ListenStream(.+)', multiline=True) | regex_replace('ListenStream=','') | trim }}
      when: docker_socket_command.status.FragmentPath != ""

    - name: Check file exists
      ansible.builtin.stat:
        path: "{{ docker_socket_path }}"
      register: docker_socket_file
      when: docker_socket_command.status.FragmentPath != ""

    - name: Assert file does not exist
      ansible.builtin.assert:
        that:
          - docker_socket_file.stat.exists
        fail_msg: "[INFO] 1.1.9 - Docker.socket does not exist"
      failed_when: false
      when: docker_socket_command.status.FragmentPath != ""

    - name: Auditd not installed
      ansible.builtin.debug:
        msg: "[FAIL] 1.1.9 - auditd not installed"
      when: (not auditd_present) and (docker_socket_command.status.FragmentPath != "") and docker_socket_file.stat.exists

    - name: Ensure auditing is configured for Docker files and directories docker.socket
      ansible.builtin.shell:
        cmd: "auditctl -l | grep {{ docker_socket_path }}"
      register: auditing_1_1_9
      when: auditd_present and (docker_socket_command.status.FragmentPath != "") and docker_socket_file.stat.exists
      failed_when: false

    - name: Assert auditing is configured
      ansible.builtin.assert:
        that:
          - auditing_1_1_9.rc == 0
        success_msg: "[PASS] 1.1.9 - Auditing is configured for the Docker socket"
        fail_msg: "[FAIL] 1.1.9 - Auditing is not configured for the Docker socket"
      when: auditd_present and (docker_socket_command.status.FragmentPath != "") and docker_socket_file.stat.exists
      failed_when: false

    - name: "1.1.9 | Collect result"
      ansible.builtin.set_fact:
        audit_results: "{{ audit_results + [{
          'id': '1.1.9',
          'section': '1.1 Host Configuration',
          'title': 'Ensure auditing is configured for Docker files and directories - docker.socket',
          'status': 'INFO' if (docker_socket_command.status.FragmentPath == '' or not docker_socket_file.stat.exists)
                    else ('FAIL' if not auditd_present
                    else ('PASS' if auditing_1_1_9.rc == 0 else 'FAIL')),
          'details': '[INFO] 1.1.9 - Docker.socket does not exist'
                     if (docker_socket_command.status.FragmentPath == '' or not docker_socket_file.stat.exists)
                     else ('[FAIL] 1.1.9 - auditd not installed' if not auditd_present
                     else ('[PASS] 1.1.9 - Auditing is configured for the Docker socket' if auditing_1_1_9.rc == 0
                     else '[FAIL] 1.1.9 - Auditing is not configured for the Docker socket'))
        }] }}"

    - name: 1.1.10 Ensure auditing is configured for Docker files and directories /etc/default/docker
