          'section': '1.1 Host Configuration',
          'title': 'Ensure auditing is configured for Docker files and directories /etc/default/docker',
          'status': 'INFO' if not etc_default_docker_stat.stat.exists
                    else ('FAIL' if not auditd_present
                    else ('PASS' if etc_default_docker_command.rc == 0 else 'FAIL')),
          'details': '[INFO] 1.1.10 - /etc/default/docker does not exist' if not etc_default_docker_stat.stat.exists
                     else ('[FAIL] 1.1.10 - auditd not installed' if not auditd_present
                     else ('[PASS] 1.1.10 - Auditing is configured for /etc/default/docker' if etc_default_docker_command.rc == 0
                     else '[FAIL] 1.1.10 - Auditing is not configured for /etc/default/docker'))
        }] }}"

    - name: 1.1.11 Ensure auditing is configured for Docker files and directories /etc/docker/daemon.json
      ansible.builtin.stat:
        path: /etc/docker/daemon.json
      register: docker_daemon_stat

    - name: Info if file doesnt exists
      ansible.builtin.debug:
