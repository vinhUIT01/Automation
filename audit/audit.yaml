                     else ('[PASS] 1.1.6 - Auditing is configured for /etc/docker' if auditing_1_1_6.rc == 0
                     else '[FAIL] 1.1.6 - Auditing is not configured for /etc/docker'))
        }] }}"

    - name: 1.1.7 Ensure auditing is configured for Docker files and directories docker.service
      ansible.builtin.systemd_service:
        name: docker.service
      register: docker_service_command

    - name: Set fact
      ansible.builtin.set_fact:
        docker_service_path: "{{ docker_service_command.status.FragmentPath }}"

    - name: Check audit rule docker.service
      ansible.builtin.shell:
        cmd: auditctl -l | grep {{ docker_service_path }}
      when: auditd_present and docker_service_path != ""
      register: docker_service_auditd
      failed_when: false

    - name: Assert file not exists
      ansible.builtin.assert:
        that:
          - docker_service_path == ""
        success_msg: "[INFO] 1.1.7 - Docker.service file does not exist"
      failed_when: false

    - name: Auditd not installed
      ansible.builtin.debug:
        msg: "[FAIL] 1.1.7 - auditd not installed"
      when: (not auditd_present) and docker_service_path != ""

    - name: Assert audit rule for docker.service
      ansible.builtin.assert:
        that:
          - docker_service_auditd.rc == 0
        success_msg: "[PASS] 1.1.7 - Auditing is configured for docker.service"
        fail_msg: "[FAIL] 1.1.7 - Auditing is not configured for docker.service"
      failed_when: false
      when: auditd_present and docker_service_path != ""

    - name: "1.1.7 | Collect result"
      ansible.builtin.set_fact:
        audit_results: "{{ audit_results + [{
          'id': '1.1.7',
          'section': '1.1 Host Configuration',
          'title': 'Ensure auditing is configured for Docker files and directories docker.service',
          'status': 'INFO' if docker_service_path == ''
                    else ('FAIL' if not auditd_present
                    else ('PASS' if docker_service_auditd.rc == 0 else 'FAIL')),
          'details': '[INFO] 1.1.7 - Docker.service file does not exist' if docker_service_path == ''
                     else ('[FAIL] 1.1.7 - auditd not installed' if not auditd_present
                     else ('[PASS] 1.1.7 - Auditing is configured for docker.service' if docker_service_auditd.rc == 0
                     else '[FAIL] 1.1.7 - Auditing is not configured for docker.service'))
        }] }}"

    - name: 1.1.8 Ensure auditing is configured for Docker files and directories containerd.sock
      ansible.builtin.stat:
        path: /run/containerd/containerd.sock
      register: containered_stats

    - name: Info if file doesnt exists
      ansible.builtin.debug:
        msg: "[INFO] 1.1.8 - Containerd.sock does not exists"
      when: not containered_stats.stat.exists

    - name: Auditd not installed
      ansible.builtin.debug:
        msg: "[FAIL] 1.1.8 - auditd not installed"
      when: (not auditd_present) and (containered_stats.stat.exists)

    - name: Check if auditing is enabled for containerd.sock
      ansible.builtin.shell:
        cmd: auditctl -l | grep /run/containerd/containerd.sock
      register: containerd_command
      when: auditd_present and containered_stats.stat.exists
      failed_when: false

    - name: Assert if auditing is enabled for containerd.sock
      ansible.builtin.assert:
        that:
          - containerd_command.rc == 0
        success_msg: "[PASS] 1.1.8 - Auditing is configured for containerd.sock"
        fail_msg: "[FAIL] 1.1.8 - Auditing is not configured for containerd.sock"
      when: auditd_present and containered_stats.stat.exists
