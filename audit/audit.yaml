        success_msg: "[PASS] 1.1.12 - Auditing is configured for /etc/containerd/config.toml"
        fail_msg: "[FAIL] 1.1.12 - Auditing is not configured for /etc/containerd/config.toml"
      when: auditd_present and containerd_config_stat.stat.exists
      failed_when: false

    - name: "1.1.12 | Collect result"
      ansible.builtin.set_fact:
        audit_results: "{{ audit_results + [{
          'id': '1.1.12',
          'section': '1.1 Host Configuration',
          'title': 'Ensure auditing is configured for Docker files and directories /etc/containerd/config.toml',
          'status': 'INFO' if not containerd_config_stat.stat.exists
                    else ('FAIL' if not auditd_present
                    else ('PASS' if etc_containerd_config_command.rc == 0 else 'FAIL')),
          'details': '[INFO] 1.1.12 - /etc/containerd/config.toml does not exist' if not containerd_config_stat.stat.exists
