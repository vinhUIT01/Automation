    - name: "1.1.11 | Collect result"
      ansible.builtin.set_fact:
        audit_results: "{{ audit_results + [{
          'id': '1.1.11',
          'section': '1.1 Host Configuration',
          'title': 'Ensure auditing is configured for Docker files and directories /etc/docker/daemon.json',
          'status': 'INFO' if not docker_daemon_stat.stat.exists
                    else ('FAIL' if not auditd_present
                    else ('PASS' if docker_daemon_command.rc == 0 else 'FAIL')),
          'details': '[INFO] 1.1.11 - /etc/docker/daemon.json does not exist' if not docker_daemon_stat.stat.exists
                     else ('[FAIL] 1.1.11 - auditd not installed' if not auditd_present
                     else ('[PASS] 1.1.11 - Auditing is configured for /etc/docker/daemon.json' if docker_daemon_command.rc == 0
                     else '[FAIL] 1.1.11 - Auditing is not configured for /etc/docker/daemon.json'))
        }] }}"

    - name: 1.1.12 Ensure auditing is configured for Docker files and directories /etc/containerd/config.toml
      ansible.builtin.stat:
        path: /etc/containerd/config.toml
      register: containerd_config_stat

    - name: Info if file doesnt exists
      ansible.builtin.debug:
