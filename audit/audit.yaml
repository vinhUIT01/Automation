      register: auditing_1_1_5
      failed_when: false
      when: auditd_present and var_lib_docker_stat.stat.exists

    - name: Assert auditing is configured
      ansible.builtin.assert:
        that:
          - auditing_1_1_5.rc == 0
        success_msg: "[PASS] 1.1.5 - Auditing is configured for /var/lib/docker"
        fail_msg: "[FAIL] 1.1.5 - Auditing is not configured for /var/lib/docker"
      when: auditd_present and var_lib_docker_stat.stat.exists
      failed_when: false

    - name: "1.1.5 | Collect result"
      ansible.builtin.set_fact:
        audit_results: "{{ audit_results + [{
          'id': '1.1.5',
          'section': '1.1 Host Configuration',
          'title': 'Ensure auditing is configured for Docker files and directories /var/lib/docker',
          'status': 'INFO' if not var_lib_docker_stat.stat.exists
                    else ('FAIL' if not auditd_present
                    else ('PASS' if auditing_1_1_5.rc == 0 else 'FAIL')),
          'details': '[INFO] 1.1.5 - /var/lib/docker does not exist' if not var_lib_docker_stat.stat.exists
                     else ('[FAIL] 1.1.5 - auditd not installed' if not auditd_present
                     else ('[PASS] 1.1.5 - Auditing is configured for /var/lib/docker' if auditing_1_1_5.rc == 0
                     else '[FAIL] 1.1.5 - Auditing is not configured for /var/lib/docker'))
        }] }}"

    - name: 1.1.6 Ensure auditing is configured for Docker files and directories /etc/docker
      ansible.builtin.stat:
        path: /etc/docker
      register: etc_docker_stat

    - name: Info if file does not exist
