      when: (not auditd_present) and docker_daemon_stat.stat.exists

    - name: Check if auditing is enabled for /etc/docker/daemon.json
      ansible.builtin.shell:
        cmd: auditctl -l | grep /etc/docker/daemon.json
      register: docker_daemon_command
      failed_when: false
      when: auditd_present and docker_daemon_stat.stat.exists

    - name: Assert if auditing is enabled for /etc/docker/daemon.json
      ansible.builtin.assert:
