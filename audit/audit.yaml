        success_msg: "[PASS] 1.1.9 - Auditing is configured for the Docker socket"
        fail_msg: "[FAIL] 1.1.9 - Auditing is not configured for the Docker socket"
      when: auditd_present and (docker_socket_command.status.FragmentPath != "") and docker_socket_file.stat.exists
