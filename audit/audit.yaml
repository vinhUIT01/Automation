- name: CIS Docker Benchmark 
  hosts: docker
  become: true
  vars:
    report_dir: /tmp/cis_docker_benchmark
    report_file: "{{ report_dir }}/cis_benchmark_report.xlsx"
    json_file: "{{ report_dir }}/cis_benchmark_results.json"
    python_script: "{{ report_dir }}/generate_report.py"
    # Accumulates one entry per check during the play
    audit_results: []
  tasks:
    - name: 1.1.1 Ensure a separate partition for containers has been created
      ansible.builtin.command:
        cmd: "{% raw %} docker info -f '{{ .DockerRootDir }}' {% endraw %}"
      register: docker_info

    - name: Check user namespace
      ansible.builtin.shell:
        cmd: "docker info | grep -q userns"
      failed_when: false
      register: userns_output

    - name: Set path to check
      ansible.builtin.set_fact:
        docker_root_path: "{{ docker_info.stdout }}/.."
      when: userns_output.rc == 0

    - name: Set path to check
      ansible.builtin.set_fact:
        docker_root_path: "{{ docker_info.stdout }}"
      when: userns_output.rc == 1

    - name: Check mount point 
      ansible.builtin.command:
        cmd: 'mountpoint -q -- "{{ docker_root_path }}"'
      register: mount_point
      failed_when: false
      
    - name: Pass / Fail
      ansible.builtin.assert:
        that:
          - mount_point.rc == 0
        success_msg: "[PASS] 1.1.1 - Separate mount point created"
        fail_msg: "[FAIL] 1.1.1 - No separate mount point created"
      register: assert_1_1_1
      failed_when: false

    - name: "1.1.1 | Collect result"
      ansible.builtin.set_fact:
        audit_results: "{{ audit_results + [{
          'id': '1.1.1',
          'section': '1.1 Host Configuration',
          'title': 'Ensure a separate partition for containers has been created',
          'status': 'PASS' if mount_point.rc == 0 else 'FAIL',
          'details': '[PASS] 1.1.1 - Separate mount point created' if mount_point.rc == 0
                     else '[FAIL] 1.1.1 - No separate mount point created'
        }] }}"
    
    - name: 1.1.2 Ensure only trusted users are allowed to control Docker daemon
      ansible.builtin.command:
        cmd: getent group docker
      register: docker_group
    
    - name: Print users in docker group
      ansible.builtin.debug:
        msg: |
          [INFO] 1.1.2 - 
          Users in docker group:\n {{ docker_group.stdout }}

    - name: "1.1.2 | Collect result"
      ansible.builtin.set_fact:
        audit_results: "{{ audit_results + [{
          'id': '1.1.2',
          'section': '1.1 Host Configuration',
          'title': 'Ensure only trusted users are allowed to control Docker daemon',
          'status': 'INFO',
          'details': '[INFO] 1.1.2 - Manual review required. Docker group members: ' ~ docker_group.stdout | replace('\n',' ')
        }] }}"

    - name: 1.1.3 Ensure auditing is configured for the Docker daemon
      ansible.builtin.shell:
        cmd: apt list --installed  | grep -w auditd
      register: auditd_output
      failed_when: false

    - name: Set fact auditd is installed
      ansible.builtin.set_fact:
        auditd_present: true
      when: auditd_output.rc == 0

    - name: Set fact auditd is not installed
      ansible.builtin.set_fact:
        auditd_present: false
      when: auditd_output.rc == 1

    - name: Print result not installed
      ansible.builtin.assert:
        that:
          - auditd_present
        fail_msg: "[FAIL] 1.1.3 - auditd not installed"
      failed_when: false

    - name: Check auditing is configured
      ansible.builtin.shell:
        cmd: auditctl -l | grep /usr/bin/dockerd
      register: auditing_1_1_3
      failed_when: false
      when: auditd_present

    - name: Assert auditing is configured
      ansible.builtin.assert:
        that:
          - auditing_1_1_3.rc == 0
        success_msg: "[PASS] 1.1.3 - Auditing is configured for the Docker daemon"
        fail_msg: "[FAIL] 1.1.3 - Auditing is not configured for the Docker daemon"
      when: auditd_present
      failed_when: false

    - name: "1.1.3 | Collect result"
      ansible.builtin.set_fact:
        audit_results: "{{ audit_results + [{
          'id': '1.1.3',
          'section': '1.1 Host Configuration',
          'title': 'Ensure auditing is configured for the Docker daemon',
          'status': 'FAIL' if not auditd_present else ('PASS' if auditing_1_1_3.rc == 0 else 'FAIL'),
          'details': '[FAIL] 1.1.3 - auditd not installed' if not auditd_present
                     else ('[PASS] 1.1.3 - Auditing is configured for the Docker daemon' if auditing_1_1_3.rc == 0
                     else '[FAIL] 1.1.3 - Auditing is not configured for the Docker daemon')
        }] }}"

    - name: 1.1.4 Ensure auditing is configured for Docker files and directories /run/containerd
      ansible.builtin.stat:
        path: /run/containerd
      register: run_containerd_stat

    - name: Info if file does not exist
      ansible.builtin.debug:
        msg: "[INFO] 1.1.4 - /run/containerd does not exist"
      when: not run_containerd_stat.stat.exists

    - name: Auditd not installed
      ansible.builtin.debug:
        msg: "[FAIL] 1.1.4 - auditd not installed"
      when: (not auditd_present) and run_containerd_stat.stat.exists

    - name: Check auditing is configured
      ansible.builtin.shell:
        cmd: auditctl -l | grep /run/containerd
      register: auditing_1_1_4
      failed_when: false
      when: auditd_present and run_containerd_stat.stat.exists

    - name: Assert auditing is configured
      ansible.builtin.assert:
        that:
          - auditing_1_1_4.rc == 0
        success_msg: "[PASS] 1.1.4 - Auditing is configured for /run/containerd"
        fail_msg: "[FAIL] 1.1.4 - Auditing is not configured for /run/containerd"
      when: auditd_present and run_containerd_stat.stat.exists
      failed_when: false

    - name: "1.1.4 | Collect result"
      ansible.builtin.set_fact:
        audit_results: "{{ audit_results + [{
          'id': '1.1.4',
          'section': '1.1 Host Configuration',
          'title': 'Ensure auditing is configured for Docker files and directories /run/containerd',
          'status': 'INFO' if not run_containerd_stat.stat.exists
                    else ('FAIL' if not auditd_present
                    else ('PASS' if auditing_1_1_4.rc == 0 else 'FAIL')),
          'details': '[INFO] 1.1.4 - /run/containerd does not exist' if not run_containerd_stat.stat.exists
                     else ('[FAIL] 1.1.4 - auditd not installed' if not auditd_present
                     else ('[PASS] 1.1.4 - Auditing is configured for /run/containerd' if auditing_1_1_4.rc == 0
                     else '[FAIL] 1.1.4 - Auditing is not configured for /run/containerd'))
        }] }}"

    - name: 1.1.5 Ensure auditing is configured for Docker files and directories /var/lib/docker
      ansible.builtin.stat:
        path: /var/lib/docker
      register: var_lib_docker_stat

    - name: Info if file does not exist
      ansible.builtin.debug:
