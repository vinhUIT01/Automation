---
- name: "Section 5 - Docker Benchmark Audit (Excel Report)"
  hosts: docker
  become: true
  gather_facts: true
  vars:
    report_dir: /tmp/docker_benchmark
    report_file: "{{ report_dir }}/docker_benchmark_section5.xlsx"
    data_file: "{{ report_dir }}/audit_data.json"        # ← data lives here
    python_script: "{{ report_dir }}/generate_report.py" # ← script reads it
    audit_results: []

  tasks:

    # ──────────────────────────────────────────────
    # Pre-flight
    # ──────────────────────────────────────────────
    - name: Create report directory
      file:
        path: "{{ report_dir }}"
        state: directory
        mode: '0755'

    - name: Ensure openpyxl is installed on target
      pip:
        name: openpyxl
        state: present
      failed_when: false

    - name: Get Docker version
      command: docker version --format '{{ '{{' }}.Server.Version{{ '}}' }}'
      register: docker_version
      changed_when: false
      failed_when: false

    - name: Get Docker info (JSON)
      command: docker info --format json
      register: docker_info_raw
      changed_when: false
      failed_when: false

    - name: Parse Docker info
      set_fact:
        docker_info: "{{ docker_info_raw.stdout | from_json }}"
      when: docker_info_raw.rc == 0

    # ──────────────────────────────────────────────
    # 5.1 – Swarm mode
    # ──────────────────────────────────────────────
    - name: "5.1 | Get Docker Swarm status"
      command: docker info --format '{{ '{{' }}json .Swarm{{ '}}' }}'
      register: swarm_info_raw
      changed_when: false
      failed_when: false

    - name: "5.1 | Parse Swarm JSON"
      set_fact:
        swarm_info: "{{ swarm_info_raw.stdout | from_json }}"
      when: swarm_info_raw.rc == 0 and swarm_info_raw.stdout != ""

    - name: "5.1 | Evaluate Swarm mode"
      set_fact:
        check_5_1:
          id: "5.1"
          section: "Section 5 - Container Runtime Security"
          title: "Ensure swarm mode is not enabled, if not needed"
          status: >-
            {{
              'FAIL' if (swarm_info is defined and swarm_info.LocalNodeState is defined
                         and swarm_info.LocalNodeState == 'active')
              else 'PASS'
            }}
          details: >-
            {{
              'Swarm mode is ACTIVE (LocalNodeState=' ~ swarm_info.LocalNodeState ~ '). Disable if not required.'
              if (swarm_info is defined and swarm_info.LocalNodeState is defined
                  and swarm_info.LocalNodeState == 'active')
              else 'Swarm mode is not active.'
            }}
          remediation: "Run: docker swarm leave --force"
          raw_output: "{{ swarm_info_raw.stdout | default('N/A') | string }}"

    - name: "5.1 | Append result"
      set_fact:
        audit_results: "{{ audit_results + [check_5_1] }}"

    # ──────────────────────────────────────────────
    # 5.2 – AppArmor profile
    # ──────────────────────────────────────────────
    - name: "5.2 | List all container IDs"
      command: docker ps --quiet --all
      register: container_ids_raw
      changed_when: false
      failed_when: false

    - name: "5.2 | Inspect AppArmor profiles"
      command: >
        docker inspect --format
        '{{ '{{' }}.Id{{ '}}' }}:AppArmorProfile={{ '{{' }}.AppArmorProfile{{ '}}' }}'
        {{ container_ids_raw.stdout_lines | join(' ') }}
      register: apparmor_raw
      changed_when: false
      failed_when: false
      when: container_ids_raw.stdout != ""

    - name: "5.2 | Detect containers missing AppArmor"
      set_fact:
        apparmor_missing: >-
          {{
            apparmor_raw.stdout_lines
            | select('search', ':AppArmorProfile=$')
            | list
          }}
      when:
        - container_ids_raw.stdout != ""
        - apparmor_raw is defined
        - apparmor_raw.rc == 0

    - name: "5.2 | Evaluate AppArmor"
      set_fact:
        check_5_2:
          id: "5.2"
          section: "Section 5 - Container Runtime Security"
          title: "Ensure that, if applicable, an AppArmor Profile is enabled"
          status: >-
            {{
              'SKIP'   if container_ids_raw.stdout == '' else
              'FAIL'   if (apparmor_missing is defined and apparmor_missing | length > 0) else
              'PASS'
            }}
          details: >-
            {{
              'No running containers found.'
              if container_ids_raw.stdout == '' else
              'Containers without AppArmor: ' ~ (apparmor_missing | join(', '))
              if (apparmor_missing is defined and apparmor_missing | length > 0) else
              'All containers have an AppArmor profile assigned.'
            }}
          remediation: >-
            Add --security-opt apparmor=<profile> when starting containers,
            or set a default AppArmor profile in /etc/docker/daemon.json.
          raw_output: "{{ apparmor_raw.stdout | default('No containers') | string }}"

    - name: "5.2 | Append result"
      set_fact:
        audit_results: "{{ audit_results + [check_5_2] }}"

    # ──────────────────────────────────────────────
    # 5.3 – SELinux security options
    # ──────────────────────────────────────────────
    - name: "5.3 | Inspect SELinux / SecurityOpt on containers"
      command: >
        docker inspect
        --format '{{ '{{' }}.Id{{ '}}' }}:SecurityOpt={{ '{{' }}.HostConfig.SecurityOpt{{ '}}' }} MountLabel={{ '{{' }}.MountLabel{{ '}}' }} ProcessLabel={{ '{{' }}.ProcessLabel{{ '}}' }}'
        {{ container_ids_raw.stdout_lines | join(' ') }}
      register: selinux_raw
      changed_when: false
      failed_when: false
      when: container_ids_raw.stdout != ""

    - name: "5.3 | Detect containers missing SELinux options"
      set_fact:
        selinux_missing: >-
          {{
            selinux_raw.stdout_lines
            | select('search', 'SecurityOpt=\[\]')
            | reject('search', 'MountLabel=system_u')
            | reject('search', 'ProcessLabel=system_u')
            | list
          }}
      when:
        - container_ids_raw.stdout != ""
        - selinux_raw is defined
        - selinux_raw.rc == 0

    - name: "5.3 | Check if SELinux is enabled on host"
      command: getenforce
      register: selinux_host
      changed_when: false
      failed_when: false

    - name: "5.3 | Evaluate SELinux"
      set_fact:
        check_5_3:
          id: "5.3"
          section: "Section 5 - Container Runtime Security"
          title: "Ensure that, if applicable, SELinux security options are set"
          status: >-
            {{
              'SKIP'   if container_ids_raw.stdout == '' else
              'INFO'   if (selinux_host.stdout | default('') not in ['Enforcing', 'Permissive']) else
              'FAIL'   if (selinux_missing is defined and selinux_missing | length > 0) else
              'PASS'
            }}
          details: >-
            {{
              'No running containers found.'
              if container_ids_raw.stdout == '' else
              'SELinux is not active on this host (getenforce: ' ~ (selinux_host.stdout | default('unknown')) ~ ').'
              if (selinux_host.stdout | default('') not in ['Enforcing', 'Permissive']) else
              'Containers without explicit SELinux SecurityOpt: ' ~ (selinux_missing | join(' | '))
              if (selinux_missing is defined and selinux_missing | length > 0) else
              'All containers have SELinux labels or security options configured.'
            }}
          remediation: >-
            Use --security-opt label=type:<type> when starting containers,
            or ensure SELinux is Enforcing on the host and Docker is configured to use it.
          raw_output: "{{ selinux_raw.stdout | default('No containers') | string }}"

    - name: "5.3 | Append result"
      set_fact:
        audit_results: "{{ audit_results + [check_5_3] }}"
    
    # ──────────────────────────────────────────────
    # 5.4 – Linux kernel capabilities
    # ──────────────────────────────────────────────
    - name: "5.4 | Inspect CapAdd and CapDrop on containers"
      command: >
        docker inspect
        --format '{{ '{{' }}.Id{{ '}}' }}:CapAdd={{ '{{' }}.HostConfig.CapAdd{{ '}}' }} CapDrop={{ '{{' }}.HostConfig.CapDrop{{ '}}' }}'
        {{ container_ids_raw.stdout_lines | join(' ') }}
      register: caps_raw
      changed_when: false
      failed_when: false
      when: container_ids_raw.stdout != ""

    - name: "5.4 | Detect containers with NET_RAW or dangerous capabilities"
      set_fact:
        # Flag any container that has NET_RAW in CapAdd (explicitly granted)
        # or has an empty CapDrop (dropped nothing at all, retains all defaults)
        caps_issues: >-
          {{
            caps_raw.stdout_lines
            | select('search', 'NET_RAW')
            | list
            + caps_raw.stdout_lines
            | select('search', 'CapDrop=\[\]')
            | list
          }}
      when:
        - container_ids_raw.stdout != ""
        - caps_raw is defined
        - caps_raw.rc == 0

    - name: "5.4 | Evaluate kernel capabilities"
      set_fact:
        check_5_4:
          id: "5.4"
          section: "Section 5 - Container Runtime Security"
          title: "Ensure that Linux kernel capabilities are restricted within containers"
          status: >-
            {{
              'SKIP' if container_ids_raw.stdout == '' else
              'FAIL' if (caps_issues is defined and caps_issues | length > 0) else
              'PASS'
            }}
          details: >-
            {{
              'No containers found.' if container_ids_raw.stdout == '' else
              'Capability issues detected: ' ~ (caps_issues | join(' | '))
              if (caps_issues is defined and caps_issues | length > 0) else
              'All containers have acceptable capability configurations.'
            }}
          remediation: >-
            Drop all capabilities and add back only what is needed:
            docker run --cap-drop=ALL --cap-add=<NEEDED_CAP> ...
            At minimum ensure NET_RAW is dropped if not required.
          raw_output: "{{ caps_raw.stdout | default('No containers') | string }}"

    - name: "5.4 | Append result"
      set_fact:
        audit_results: "{{ audit_results + [check_5_4] }}"

    # ──────────────────────────────────────────────
    # 5.5 – Privileged containers
    # ──────────────────────────────────────────────
    - name: "5.5 | Inspect Privileged flag on containers"
      command: >
        docker inspect
        --format '{{ '{{' }}.Id{{ '}}' }}:Privileged={{ '{{' }}.HostConfig.Privileged{{ '}}' }}'
        {{ container_ids_raw.stdout_lines | join(' ') }}
      register: privileged_raw
      changed_when: false
      failed_when: false
      when: container_ids_raw.stdout != ""

    - name: "5.5 | Detect privileged containers"
      set_fact:
        privileged_containers: >-
          {{
            privileged_raw.stdout_lines
            | select('search', 'Privileged=true')
            | list
          }}
      when:
        - container_ids_raw.stdout != ""
        - privileged_raw is defined
        - privileged_raw.rc == 0

    - name: "5.5 | Evaluate privileged containers"
      set_fact:
        check_5_5:
          id: "5.5"
          section: "Section 5 - Container Runtime Security"
          title: "Ensure that privileged containers are not used"
          status: >-
            {{
              'SKIP' if container_ids_raw.stdout == '' else
              'FAIL' if (privileged_containers is defined and privileged_containers | length > 0) else
              'PASS'
            }}
          details: >-
            {{
              'No containers found.' if container_ids_raw.stdout == '' else
              'Privileged containers found: ' ~ (privileged_containers | join(' | '))
              if (privileged_containers is defined and privileged_containers | length > 0) else
              'No privileged containers detected. All containers return Privileged=false.'
            }}
          remediation: >-
            Remove the --privileged flag from docker run commands.
            Use specific --cap-add flags for the exact capabilities needed instead.
          raw_output: "{{ privileged_raw.stdout | default('No containers') | string }}"

    - name: "5.5 | Append result"
      set_fact:
        audit_results: "{{ audit_results + [check_5_5] }}"

    # ──────────────────────────────────────────────
    # 5.6 – Sensitive host directory mounts
    # ──────────────────────────────────────────────

    # Sensitive host paths that should never be bind-mounted into containers.
    # These give a container access to critical host filesystem areas.
    - name: "5.6 | Inspect volume mounts on containers"
      command: >
        docker inspect
        --format '{{ '{{' }}.Id{{ '}}' }}:Volumes={{ '{{' }}json .Mounts{{ '}}' }}'
        {{ container_ids_raw.stdout_lines | join(' ') }}
      register: volumes_raw
      changed_when: false
      failed_when: false
      when: container_ids_raw.stdout != ""

    - name: "5.6 | Parse mounts per container and flag sensitive paths"
      set_fact:
        # Check each container line for known sensitive host paths.
        # The CIS benchmark specifically calls out: /, /boot, /dev, /etc,
        # /lib, /proc, /sys, /usr as paths that should not be bind-mounted.
        sensitive_mounts: >-
          {{
            volumes_raw.stdout_lines | select('search',
              '("Source":"\/"|"Source":"\/boot|"Source":"\/dev|'
              ~ '"Source":"\/etc|"Source":"\/lib|"Source":"\/proc|'
              ~ '"Source":"\/sys|"Source":"\/usr)'
            ) | list
          }}
        # Additionally flag any mount that is read-write (rw) — informational
        rw_mounts: >-
          {{
            volumes_raw.stdout_lines
            | select('search', '"RW":true')
            | list
          }}
      when:
        - container_ids_raw.stdout != ""
        - volumes_raw is defined
        - volumes_raw.rc == 0

    - name: "5.6 | Evaluate volume mounts"
      set_fact:
        check_5_6:
          id: "5.6"
          section: "Section 5 - Container Runtime Security"
          title: "Ensure sensitive host system directories are not mounted on containers"
          status: >-
            {{
              'SKIP' if container_ids_raw.stdout == '' else
              'FAIL' if (sensitive_mounts is defined and sensitive_mounts | length > 0) else
              'WARN' if (rw_mounts is defined and rw_mounts | length > 0) else
              'PASS'
            }}
          details: >-
            {{
              'No containers found.' if container_ids_raw.stdout == '' else
              'Sensitive host paths mounted: ' ~ (sensitive_mounts | join(' | '))
              if (sensitive_mounts is defined and sensitive_mounts | length > 0) else
              'No sensitive paths mounted. Note: ' ~ (rw_mounts | length) ~ ' read-write mount(s) detected - review manually.'
              if (rw_mounts is defined and rw_mounts | length > 0) else
              'No sensitive mounts detected.'
            }}
          remediation: >-
            Remove mounts of sensitive host directories (/, /etc, /proc, /sys, /dev etc.).
            Where mounts are needed, use read-only mode: -v /host/path:/container/path:ro
          raw_output: "{{ volumes_raw.stdout | default('No containers') | string }}"

    - name: "5.6 | Append result"
      set_fact:
        audit_results: "{{ audit_results + [check_5_6] }}"

    # ──────────────────────────────────────────────
    # 5.7 – SSH daemon inside containers
    # ──────────────────────────────────────────────

    # SSHd inside a container is a design anti-pattern.
    # It creates an extra attack surface and bypasses Docker's
    # exec/attach mechanisms which are the correct way to get a shell.
    - name: "5.7 | Get list of running container IDs only"
      command: docker ps --quiet
      register: running_ids_raw
      changed_when: false
      failed_when: false

    - name: "5.7 | Check each running container for sshd process"
      command: docker exec {{ item }} ps -el
      register: sshd_check_results
      changed_when: false
      failed_when: false
      # If ps is not in the container image, failed_when:false ensures we skip gracefully
      loop: "{{ running_ids_raw.stdout_lines }}"
      when: running_ids_raw.stdout != ""

    - name: "5.7 | Identify containers running sshd"
      set_fact:
        sshd_containers: >-
          {{
            sshd_check_results.results
            | selectattr('stdout', 'defined')
            | selectattr('stdout', 'search', 'sshd')
            | map(attribute='item')
            | list
          }}
      when:
        - running_ids_raw.stdout != ""
        - sshd_check_results is defined

    - name: "5.7 | Evaluate sshd presence"
      set_fact:
        check_5_7:
          id: "5.7"
          section: "Section 5 - Container Runtime Security"
          title: "Ensure sshd is not run within containers"
          status: >-
            {{
              'SKIP' if running_ids_raw.stdout == '' else
              'FAIL' if (sshd_containers is defined and sshd_containers | length > 0) else
              'PASS'
            }}
          details: >-
            {{
              'No running containers found.' if running_ids_raw.stdout == '' else
              'SSHd detected in containers: ' ~ (sshd_containers | join(', '))
              if (sshd_containers is defined and sshd_containers | length > 0) else
              'No sshd process found in any running container.'
            }}
          remediation: >-
            Remove sshd from container images. Use docker exec to get shell access:
            docker exec -it <container_id> /bin/sh
            Or use docker attach for foreground containers.
          raw_output: >-
            {{
              sshd_check_results.results
              | selectattr('stdout', 'defined')
              | map(attribute='stdout')
              | join('\n---\n')
              | default('No output')
              | string
              if sshd_check_results is defined
              else 'No containers checked'
            }}

    - name: "5.7 | Append result"
      set_fact:
        audit_results: "{{ audit_results + [check_5_7] }}"

    # 5.8 Ensure privileged ports are not mapped within containers (Manual)
    - name: "5.8 | Get running container IDs"
      command: docker ps --quiet
      register: running_ids
      changed_when: false
      failed_when: false
      
    
    # - name: "Ensure privileged ports are not mapped within containers"
    # - name: "Do not fill this"
    # - name: "5.8 | "
    #   setfact:
    #     check_5_8:
    #     id: "5.8"
    #     section: "Section 5 - Container Runtime Security"
    #     title: "Ensure privileged ports are not mapped within containers"
    #     status: >-
    #     details: >-
    #     remediation: >-
    #     raw_output: >-
    # - name: "5.8 | Append result"
    #   set_fact:
    #     audit_results: "{{ audit_results + [check_5_8] }}"
        # 5.9 – Only needed ports are open on container
    # ──────────────────────────────────────────────
    # Checks EXPOSED ports declared in the image vs what's actually published.
    # A port exposed but not published is low risk; a port published to 0.0.0.0
    # when it shouldn't be is the real concern — flag those for manual review.
    - name: "5.9 | Inspect exposed and published ports per container"
      command: >
        docker inspect
        --format '{{ '{{' }}.Id{{ '}}' }}:Exposed={{ '{{' }}json .Config.ExposedPorts{{ '}}' }} Published={{ '{{' }}json .NetworkSettings.Ports{{ '}}' }}'
        {{ container_ids_raw.stdout_lines | join(' ') }}
      register: ports_9_raw
      changed_when: false
      failed_when: false
      when: container_ids_raw.stdout != ""

    - name: "5.9 | Flag containers publishing to 0.0.0.0 (all interfaces)"
      set_fact:
        ports_all_interfaces: >-
          {{
            ports_9_raw.stdout_lines
            | select('search', '"HostIp":"0.0.0.0"')
            | list
          }}
      when:
        - container_ids_raw.stdout != ""
        - ports_9_raw is defined
        - ports_9_raw.rc == 0

    - name: "5.9 | Evaluate open ports"
      set_fact:
        check_5_9:
          id: "5.9"
          section: "Section 5 - Container Runtime Security"
          title: "Ensure that only needed ports are open on the container"
          status: >-
            {{
              'SKIP' if container_ids_raw.stdout == '' else
              'WARN' if (ports_all_interfaces is defined and ports_all_interfaces | length > 0) else
              'PASS'
            }}
          details: >-
            {{
              'No containers found.' if container_ids_raw.stdout == '' else
              (ports_all_interfaces | length | string) ~ ' container(s) publish ports on 0.0.0.0. Review whether all published ports are required: ' ~ (ports_all_interfaces | map('regex_replace', ':Exposed=.*', '') | join(', '))
              if (ports_all_interfaces is defined and ports_all_interfaces | length > 0) else
              'No containers are publishing ports on all interfaces.'
            }}
          remediation: >-
            Bind published ports to a specific host IP instead of 0.0.0.0.
            Use -p 127.0.0.1:<host_port>:<container_port> for internal-only services.
            Remove EXPOSE directives from Dockerfiles for ports not required at runtime.
          raw_output: "{{ ports_9_raw.stdout | default('No containers') | string }}"

    - name: "5.9 | Append result"
      set_fact:
        audit_results: "{{ audit_results + [check_5_9] }}"

    # ──────────────────────────────────────────────
    # 5.10 – Host network namespace not shared
    # ──────────────────────────────────────────────
    # --network=host removes all network isolation: the container shares the
    # host's network stack directly, seeing all interfaces and open ports.
    - name: "5.10 | Inspect NetworkMode on all containers"
      command: >
        docker inspect
        --format '{{ '{{' }}.Id{{ '}}' }}:NetworkMode={{ '{{' }}.HostConfig.NetworkMode{{ '}}' }}'
        {{ container_ids_raw.stdout_lines | join(' ') }}
      register: netmode_raw
      changed_when: false
      failed_when: false
      when: container_ids_raw.stdout != ""

    - name: "5.10 | Detect containers using host network"
      set_fact:
        host_network_containers: >-
          {{
            netmode_raw.stdout_lines
            | select('search', 'NetworkMode=host')
            | list
          }}
      when:
        - container_ids_raw.stdout != ""
        - netmode_raw is defined
        - netmode_raw.rc == 0

    - name: "5.10 | Evaluate host network namespace"
      set_fact:
        check_5_10:
          id: "5.10"
          section: "Section 5 - Container Runtime Security"
          title: "Ensure that the host's network namespace is not shared"
          status: >-
            {{
              'SKIP' if container_ids_raw.stdout == '' else
              'FAIL' if (host_network_containers is defined and host_network_containers | length > 0) else
              'PASS'
            }}
          details: >-
            {{
              'No containers found.' if container_ids_raw.stdout == '' else
              'Containers sharing the host network namespace: ' ~ (host_network_containers | join(' | '))
              if (host_network_containers is defined and host_network_containers | length > 0) else
              'No containers are using --network=host.'
            }}
          remediation: >-
            Remove --network=host from docker run commands.
            Use Docker bridge or overlay networks and publish only the specific
            ports required with -p <host_port>:<container_port>.
          raw_output: "{{ netmode_raw.stdout | default('No containers') | string }}"

    - name: "5.10 | Append result"
      set_fact:
        audit_results: "{{ audit_results + [check_5_10] }}"

    # ──────────────────────────────────────────────
    # 5.11 – Memory usage limited
    # ──────────────────────────────────────────────
    # Without a memory limit a single container can exhaust host RAM causing
    # an OOM kill of other containers or the Docker daemon itself.
    # Memory == 0 means no limit is set.
    - name: "5.11 | Inspect memory limits on all containers"
      command: >
        docker inspect
        --format '{{ '{{' }}.Id{{ '}}' }}:Memory={{ '{{' }}.HostConfig.Memory{{ '}}' }}'
        {{ container_ids_raw.stdout_lines | join(' ') }}
      register: memory_raw
      changed_when: false
      failed_when: false
      when: container_ids_raw.stdout != ""

    - name: "5.11 | Detect containers with no memory limit"
      set_fact:
        unlimited_memory: >-
          {{
            memory_raw.stdout_lines
            | select('search', ':Memory=0$')
            | list
          }}
      when:
        - container_ids_raw.stdout != ""
        - memory_raw is defined
        - memory_raw.rc == 0

    - name: "5.11 | Evaluate memory limits"
      set_fact:
        check_5_11:
          id: "5.11"
          section: "Section 5 - Container Runtime Security"
          title: "Ensure that the memory usage for containers is limited"
          status: >-
            {{
              'SKIP' if container_ids_raw.stdout == '' else
              'FAIL' if (unlimited_memory is defined and unlimited_memory | length > 0) else
              'PASS'
            }}
          details: >-
            {{
              'No containers found.' if container_ids_raw.stdout == '' else
              'Containers with no memory limit (Memory=0): ' ~ (unlimited_memory | join(' | '))
              if (unlimited_memory is defined and unlimited_memory | length > 0) else
              'All containers have a memory limit configured.'
            }}
          remediation: >-
            Set a memory limit when starting containers:
            docker run --memory=<limit> (e.g. --memory=512m)
            Or set default memory limits in /etc/docker/daemon.json under "default-ulimits".
          raw_output: "{{ memory_raw.stdout | default('No containers') | string }}"

    - name: "5.11 | Append result"
      set_fact:
        audit_results: "{{ audit_results + [check_5_11] }}"

    # ──────────────────────────────────────────────
    # 5.12 – CPU priority set appropriately
    # ──────────────────────────────────────────────
    # CpuShares=0 means the container inherits Docker's default (1024).
    # Leaving all containers at default means no prioritisation is defined —
    # a runaway container can starve others. Any explicit non-zero value shows
    # the operator has made a deliberate decision.
    - name: "5.12 | Inspect CPU shares on all containers"
      command: >
        docker inspect
        --format '{{ '{{' }}.Id{{ '}}' }}:CpuShares={{ '{{' }}.HostConfig.CpuShares{{ '}}' }}'
        {{ container_ids_raw.stdout_lines | join(' ') }}
      register: cpu_raw
      changed_when: false
      failed_when: false
      when: container_ids_raw.stdout != ""

    - name: "5.12 | Detect containers with default (0) CPU shares"
      set_fact:
        default_cpu: >-
          {{
            cpu_raw.stdout_lines
            | select('search', ':CpuShares=0$')
            | list
          }}
      when:
        - container_ids_raw.stdout != ""
        - cpu_raw is defined
        - cpu_raw.rc == 0

    - name: "5.12 | Evaluate CPU priority"
      set_fact:
        check_5_12:
          id: "5.12"
          section: "Section 5 - Container Runtime Security"
          title: "Ensure that CPU priority is set appropriately on containers"
          status: >-
            {{
              'SKIP' if container_ids_raw.stdout == '' else
              'WARN' if (default_cpu is defined and default_cpu | length > 0) else
              'PASS'
            }}
          details: >-
            {{
              'No containers found.' if container_ids_raw.stdout == '' else
              (default_cpu | length | string) ~ ' container(s) using default CPU shares (0). Explicit prioritisation is recommended: ' ~ (default_cpu | map('regex_replace', ':CpuShares=.*', '') | join(', '))
              if (default_cpu is defined and default_cpu | length > 0) else
              'All containers have explicit CPU shares configured.'
            }}
          remediation: >-
            Set CPU shares relative to other containers using:
            docker run --cpu-shares=<value>
            Default is 1024. Lower values get less CPU time under contention.
            Consider also --cpus= to set a hard CPU quota.
          raw_output: "{{ cpu_raw.stdout | default('No containers') | string }}"

    - name: "5.12 | Append result"
      set_fact:
        audit_results: "{{ audit_results + [check_5_12] }}"

    # ──────────────────────────────────────────────
    # 5.13 – Root filesystem mounted read-only
    # ──────────────────────────────────────────────
    # ReadonlyRootfs=false means the container's root filesystem is writable.
    # Making it read-only forces all writes through explicitly declared volumes
    # and prevents an attacker from modifying container binaries at runtime.
    - name: "5.13 | Inspect ReadonlyRootfs on all containers"
      command: >
        docker inspect
        --format '{{ '{{' }}.Id{{ '}}' }}:ReadonlyRootfs={{ '{{' }}.HostConfig.ReadonlyRootfs{{ '}}' }}'
        {{ container_ids_raw.stdout_lines | join(' ') }}
      register: rootfs_raw
      changed_when: false
      failed_when: false
      when: container_ids_raw.stdout != ""

    - name: "5.13 | Detect containers with writable root filesystem"
      set_fact:
        writable_rootfs: >-
          {{
            rootfs_raw.stdout_lines
            | select('search', 'ReadonlyRootfs=false')
            | list
          }}
      when:
        - container_ids_raw.stdout != ""
        - rootfs_raw is defined
        - rootfs_raw.rc == 0

    - name: "5.13 | Evaluate root filesystem"
      set_fact:
        check_5_13:
          id: "5.13"
          section: "Section 5 - Container Runtime Security"
          title: "Ensure that the container's root filesystem is mounted as read only"
          status: >-
            {{
              'SKIP' if container_ids_raw.stdout == '' else
              'FAIL' if (writable_rootfs is defined and writable_rootfs | length > 0) else
              'PASS'
            }}
          details: >-
            {{
              'No containers found.' if container_ids_raw.stdout == '' else
              'Containers with writable root filesystem: ' ~ (writable_rootfs | join(' | '))
              if (writable_rootfs is defined and writable_rootfs | length > 0) else
              'All containers have a read-only root filesystem.'
            }}
          remediation: >-
            Start containers with --read-only flag:
            docker run --read-only ...
            Mount writable paths explicitly as volumes:
            docker run --read-only -v /tmp:/tmp:rw ...
          raw_output: "{{ rootfs_raw.stdout | default('No containers') | string }}"

    - name: "5.13 | Append result"
      set_fact:
        audit_results: "{{ audit_results + [check_5_13] }}"

    # ──────────────────────────────────────────────
    # 5.14 – Incoming traffic bound to specific interface
    # ──────────────────────────────────────────────
    # HostIp="0.0.0.0" means the port is bound on ALL host interfaces.
    # Traffic should be bound to a specific IP (e.g. 127.0.0.1 for internal,
    # or a specific NIC IP for external) to restrict exposure.
    - name: "5.14 | Inspect port bindings for interface specificity"
      command: >
        docker inspect
        --format '{{ '{{' }}.Id{{ '}}' }}:Ports={{ '{{' }}json .NetworkSettings.Ports{{ '}}' }}'
        {{ container_ids_raw.stdout_lines | join(' ') }}
      register: binding_raw
      changed_when: false
      failed_when: false
      when: container_ids_raw.stdout != ""

    - name: "5.14 | Detect containers bound to all interfaces"
      set_fact:
        unbound_containers: >-
          {{
            binding_raw.stdout_lines
            | select('search', '"HostIp":"0.0.0.0"')
            | list
          }}
      when:
        - container_ids_raw.stdout != ""
        - binding_raw is defined
        - binding_raw.rc == 0

    - name: "5.14 | Evaluate interface binding"
      set_fact:
        check_5_14:
          id: "5.14"
          section: "Section 5 - Container Runtime Security"
          title: "Ensure that incoming container traffic is bound to a specific host interface"
          status: >-
            {{
              'SKIP' if container_ids_raw.stdout == '' else
              'FAIL' if (unbound_containers is defined and unbound_containers | length > 0) else
              'PASS'
            }}
          details: >-
            {{
              'No containers found.' if container_ids_raw.stdout == '' else
              'Containers bound to all interfaces (0.0.0.0): ' ~ (unbound_containers | map('regex_replace', ':Ports=.*', '') | join(', '))
              if (unbound_containers is defined and unbound_containers | length > 0) else
              'All container port bindings are tied to a specific host interface.'
            }}
          remediation: >-
            Bind ports to a specific host IP:
            docker run -p 192.168.1.10:80:80 ...   # specific external NIC
            docker run -p 127.0.0.1:8080:80 ...    # localhost only
            Avoid -p 0.0.0.0:<port>:<port> or shorthand -p <port>:<port>.
          raw_output: "{{ binding_raw.stdout | default('No containers') | string }}"

    - name: "5.14 | Append result"
      set_fact:
        audit_results: "{{ audit_results + [check_5_14] }}"

    # ──────────────────────────────────────────────
    # 5.15 – on-failure restart policy max 5
    # ──────────────────────────────────────────────
    # RestartPolicy.Name should be "on-failure" AND MaximumRetryCount <= 5.
    # "always" or "unless-stopped" means the container restarts indefinitely
    # even after repeated crashes — hiding a broken/compromised container.
    # "no" (or empty) means the container never restarts — also not ideal.
    - name: "5.15 | Inspect restart policies on all containers"
      command: >
        docker inspect
        --format '{{ '{{' }}.Id{{ '}}' }}:RestartPolicy={{ '{{' }}.HostConfig.RestartPolicy.Name{{ '}}' }} MaxRetry={{ '{{' }}.HostConfig.RestartPolicy.MaximumRetryCount{{ '}}' }}'
        {{ container_ids_raw.stdout_lines | join(' ') }}
      register: restart_raw
      changed_when: false
      failed_when: false
      when: container_ids_raw.stdout != ""

    - name: "5.15 | Detect containers not using on-failure with max 5"
      set_fact:
        bad_restart_policy: >-
          {{
            restart_raw.stdout_lines
            | reject('search', 'RestartPolicy=on-failure MaxRetry=[1-5]$')
            | reject('search', 'RestartPolicy=on-failure MaxRetry=[1-5]\s')
            | list
          }}
      when:
        - container_ids_raw.stdout != ""
        - restart_raw is defined
        - restart_raw.rc == 0

    - name: "5.15 | Evaluate restart policy"
      set_fact:
        check_5_15:
          id: "5.15"
          section: "Section 5 - Container Runtime Security"
          title: "Ensure that the on-failure container restart policy is set to 5"
          status: >-
            {{
              'SKIP' if container_ids_raw.stdout == '' else
              'FAIL' if (bad_restart_policy is defined and bad_restart_policy | length > 0) else
              'PASS'
            }}
          details: >-
            {{
              'No containers found.' if container_ids_raw.stdout == '' else
              'Containers without correct restart policy (on-failure, max 5): ' ~ (bad_restart_policy | join(' | '))
              if (bad_restart_policy is defined and bad_restart_policy | length > 0) else
              'All containers use on-failure restart policy with MaximumRetryCount <= 5.'
            }}
          remediation: >-
            Set the restart policy when starting containers:
            docker run --restart=on-failure:5 ...
            For existing containers: docker update --restart=on-failure:5 <container_id>
          raw_output: "{{ restart_raw.stdout | default('No containers') | string }}"

    - name: "5.15 | Append result"
      set_fact:
        audit_results: "{{ audit_results + [check_5_15] }}"

    # ──────────────────────────────────────────────
    # 5.16 – Host PID namespace not shared
    # ──────────────────────────────────────────────
    # --pid=host lets the container see and signal ALL host processes.
    # This completely breaks process isolation.
    - name: "5.16 | Inspect PidMode on all containers"
      command: >
        docker inspect
        --format '{{ '{{' }}.Id{{ '}}' }}:PidMode={{ '{{' }}.HostConfig.PidMode{{ '}}' }}'
        {{ container_ids_raw.stdout_lines | join(' ') }}
      register: pidmode_raw
      changed_when: false
      failed_when: false
      when: container_ids_raw.stdout != ""

    - name: "5.16 | Detect containers sharing host PID namespace"
      set_fact:
        host_pid_containers: >-
          {{
            pidmode_raw.stdout_lines
            | select('search', 'PidMode=host')
            | list
          }}
      when:
        - container_ids_raw.stdout != ""
        - pidmode_raw is defined
        - pidmode_raw.rc == 0

    - name: "5.16 | Evaluate PID namespace"
      set_fact:
        check_5_16:
          id: "5.16"
          section: "Section 5 - Container Runtime Security"
          title: "Ensure that the host's process namespace is not shared"
          status: >-
            {{
              'SKIP' if container_ids_raw.stdout == '' else
              'FAIL' if (host_pid_containers is defined and host_pid_containers | length > 0) else
              'PASS'
            }}
          details: >-
            {{
              'No containers found.' if container_ids_raw.stdout == '' else
              'Containers sharing host PID namespace: ' ~ (host_pid_containers | join(' | '))
              if (host_pid_containers is defined and host_pid_containers | length > 0) else
              'No containers are sharing the host PID namespace.'
            }}
          remediation: >-
            Remove --pid=host from docker run commands.
            Containers should use their own isolated PID namespace (the default).
          raw_output: "{{ pidmode_raw.stdout | default('No containers') | string }}"

    - name: "5.16 | Append result"
      set_fact:
        audit_results: "{{ audit_results + [check_5_16] }}"

    # ──────────────────────────────────────────────
    # 5.17 – Host IPC namespace not shared
    # ──────────────────────────────────────────────
    # --ipc=host lets the container read/write shared memory segments on the
    # host — a vector for data leakage between containers and host processes.
    - name: "5.17 | Inspect IpcMode on all containers"
      command: >
        docker inspect
        --format '{{ '{{' }}.Id{{ '}}' }}:IpcMode={{ '{{' }}.HostConfig.IpcMode{{ '}}' }}'
        {{ container_ids_raw.stdout_lines | join(' ') }}
      register: ipcmode_raw
      changed_when: false
      failed_when: false
      when: container_ids_raw.stdout != ""

    - name: "5.17 | Detect containers sharing host IPC namespace"
      set_fact:
        host_ipc_containers: >-
          {{
            ipcmode_raw.stdout_lines
            | select('search', 'IpcMode=host')
            | list
          }}
      when:
        - container_ids_raw.stdout != ""
        - ipcmode_raw is defined
        - ipcmode_raw.rc == 0

    - name: "5.17 | Evaluate IPC namespace"
      set_fact:
        check_5_17:
          id: "5.17"
          section: "Section 5 - Container Runtime Security"
          title: "Ensure that the host's IPC namespace is not shared"
          status: >-
            {{
              'SKIP' if container_ids_raw.stdout == '' else
              'FAIL' if (host_ipc_containers is defined and host_ipc_containers | length > 0) else
              'PASS'
            }}
          details: >-
            {{
              'No containers found.' if container_ids_raw.stdout == '' else
              'Containers sharing host IPC namespace: ' ~ (host_ipc_containers | join(' | '))
              if (host_ipc_containers is defined and host_ipc_containers | length > 0) else
              'No containers are sharing the host IPC namespace.'
            }}
          remediation: >-
            Remove --ipc=host from docker run commands.
            If two containers need shared memory, use --ipc=container:<name>
            to share only between those containers, not with the host.
          raw_output: "{{ ipcmode_raw.stdout | default('No containers') | string }}"

    - name: "5.17 | Append result"
      set_fact:
        audit_results: "{{ audit_results + [check_5_17] }}"

    # ──────────────────────────────────────────────
    # 5.18 – Host devices not exposed to containers
    # ──────────────────────────────────────────────
    # --device mounts host device nodes inside the container.
    # A non-empty Devices list means the container has direct hardware access.
    - name: "5.18 | Inspect Devices on all containers"
      command: >
        docker inspect
        --format '{{ '{{' }}.Id{{ '}}' }}:Devices={{ '{{' }}json .HostConfig.Devices{{ '}}' }}'
        {{ container_ids_raw.stdout_lines | join(' ') }}
      register: devices_raw
      changed_when: false
      failed_when: false
      when: container_ids_raw.stdout != ""

    - name: "5.18 | Detect containers with host devices exposed"
      set_fact:
        exposed_devices: >-
          {{
            devices_raw.stdout_lines
            | reject('search', 'Devices=\[\]')
            | reject('search', 'Devices=null')
            | list
          }}
      when:
        - container_ids_raw.stdout != ""
        - devices_raw is defined
        - devices_raw.rc == 0

    - name: "5.18 | Evaluate host device exposure"
      set_fact:
        check_5_18:
          id: "5.18"
          section: "Section 5 - Container Runtime Security"
          title: "Ensure that host devices are not directly exposed to containers"
          status: >-
            {{
              'SKIP' if container_ids_raw.stdout == '' else
              'WARN' if (exposed_devices is defined and exposed_devices | length > 0) else
              'PASS'
            }}
          details: >-
            {{
              'No containers found.' if container_ids_raw.stdout == '' else
              'Containers with host devices exposed (review if required): ' ~ (exposed_devices | join(' | '))
              if (exposed_devices is defined and exposed_devices | length > 0) else
              'No containers have host devices directly exposed.'
            }}
          remediation: >-
            Remove --device flags unless absolutely required.
            If a device is needed, restrict permissions to the minimum:
            docker run --device=/dev/snd:/dev/snd:r  (read-only)
            Never pass --device=/dev without a specific path.
          raw_output: "{{ devices_raw.stdout | default('No containers') | string }}"

    - name: "5.18 | Append result"
      set_fact:
        audit_results: "{{ audit_results + [check_5_18] }}"

    # ──────────────────────────────────────────────
    # 5.19 – Default ulimit not relied upon
    # ──────────────────────────────────────────────
    # Ulimits=[] means no per-container ulimits are set; the container inherits
    # daemon defaults. CIS requires either per-container overrides or
    # explicit daemon defaults — both cases must be manually verified.
    - name: "5.19 | Inspect Ulimits on all containers"
      command: >
        docker inspect
        --format '{{ '{{' }}.Id{{ '}}' }}:Ulimits={{ '{{' }}json .HostConfig.Ulimits{{ '}}' }}'
        {{ container_ids_raw.stdout_lines | join(' ') }}
      register: ulimits_raw
      changed_when: false
      failed_when: false
      when: container_ids_raw.stdout != ""

    - name: "5.19 | Detect containers relying on default ulimits"
      set_fact:
        default_ulimits: >-
          {{
            ulimits_raw.stdout_lines
            | select('search', 'Ulimits=\[\]')
            | list
          }}
      when:
        - container_ids_raw.stdout != ""
        - ulimits_raw is defined
        - ulimits_raw.rc == 0

    - name: "5.19 | Evaluate ulimit configuration"
      set_fact:
        check_5_19:
          id: "5.19"
          section: "Section 5 - Container Runtime Security"
          title: "Ensure that the default ulimit is overwritten at runtime if needed"
          status: >-
            {{
              'SKIP' if container_ids_raw.stdout == '' else
              'INFO' if (default_ulimits is defined and default_ulimits | length > 0) else
              'PASS'
            }}
          details: >-
            {{
              'No containers found.' if container_ids_raw.stdout == '' else
              (default_ulimits | length | string) ~ ' container(s) using daemon default ulimits. Verify daemon defaults are hardened: ' ~ (default_ulimits | map('regex_replace', ':Ulimits=.*', '') | join(', '))
              if (default_ulimits is defined and default_ulimits | length > 0) else
              'All containers have explicit ulimit overrides configured.'
            }}
          remediation: >-
            Set per-container ulimits at runtime:
            docker run --ulimit nofile=1024:1024 --ulimit nproc=100 ...
            Or configure daemon-wide defaults in /etc/docker/daemon.json:
            { "default-ulimits": { "nofile": { "Name": "nofile", "Hard": 64000, "Soft": 64000 } } }
          raw_output: "{{ ulimits_raw.stdout | default('No containers') | string }}"

    - name: "5.19 | Append result"
      set_fact:
        audit_results: "{{ audit_results + [check_5_19] }}"

    # ──────────────────────────────────────────────
    # 5.20 – Mount propagation not set to shared
    # ──────────────────────────────────────────────
    # "shared" propagation means mounts inside the container are visible on
    # the host and vice versa — breaking filesystem isolation.
    # "slave" or "private" (default) are safe.
    - name: "5.20 | Inspect mount propagation on all containers"
      command: >
        docker inspect
        --format '{{ '{{' }}.Id{{ '}}' }}:Mounts={{ '{{' }}json .Mounts{{ '}}' }}'
        {{ container_ids_raw.stdout_lines | join(' ') }}
      register: mountprop_raw
      changed_when: false
      failed_when: false
      when: container_ids_raw.stdout != ""

    - name: "5.20 | Detect shared mount propagation"
      set_fact:
        shared_mounts: >-
          {{
            mountprop_raw.stdout_lines
            | select('search', '"Propagation":"shared"')
            | list
          }}
      when:
        - container_ids_raw.stdout != ""
        - mountprop_raw is defined
        - mountprop_raw.rc == 0

    - name: "5.20 | Evaluate mount propagation"
      set_fact:
        check_5_20:
          id: "5.20"
          section: "Section 5 - Container Runtime Security"
          title: "Ensure mount propagation mode is not set to shared"
          status: >-
            {{
              'SKIP' if container_ids_raw.stdout == '' else
              'FAIL' if (shared_mounts is defined and shared_mounts | length > 0) else
              'PASS'
            }}
          details: >-
            {{
              'No containers found.' if container_ids_raw.stdout == '' else
              'Containers with shared mount propagation: ' ~ (shared_mounts | map('regex_replace', ':Mounts=.*', '') | join(', '))
              if (shared_mounts is defined and shared_mounts | length > 0) else
              'No containers are using shared mount propagation.'
            }}
          remediation: >-
            Change mount propagation from shared to private or slave:
            docker run -v /host/path:/container/path:slave ...
            Remove :shared from any -v bind mount options.
          raw_output: "{{ mountprop_raw.stdout | default('No containers') | string }}"

    - name: "5.20 | Append result"
      set_fact:
        audit_results: "{{ audit_results + [check_5_20] }}"

    # ──────────────────────────────────────────────
    # 5.21 – Host UTS namespace not shared
    # ──────────────────────────────────────────────
    # --uts=host shares the host's hostname and domain name with the container.
    # This allows the container to change the host's hostname — a privilege
    # that has no place in a hardened environment.
    - name: "5.21 | Inspect UTSMode on all containers"
      command: >
        docker inspect
        --format '{{ '{{' }}.Id{{ '}}' }}:UTSMode={{ '{{' }}.HostConfig.UTSMode{{ '}}' }}'
        {{ container_ids_raw.stdout_lines | join(' ') }}
      register: utsmode_raw
      changed_when: false
      failed_when: false
      when: container_ids_raw.stdout != ""

    - name: "5.21 | Detect containers sharing host UTS namespace"
      set_fact:
        host_uts_containers: >-
          {{
            utsmode_raw.stdout_lines
            | select('search', 'UTSMode=host')
            | list
          }}
      when:
        - container_ids_raw.stdout != ""
        - utsmode_raw is defined
        - utsmode_raw.rc == 0

    - name: "5.21 | Evaluate UTS namespace"
      set_fact:
        check_5_21:
          id: "5.21"
          section: "Section 5 - Container Runtime Security"
          title: "Ensure that the host's UTS namespace is not shared"
          status: >-
            {{
              'SKIP' if container_ids_raw.stdout == '' else
              'FAIL' if (host_uts_containers is defined and host_uts_containers | length > 0) else
              'PASS'
            }}
          details: >-
            {{
              'No containers found.' if container_ids_raw.stdout == '' else
              'Containers sharing host UTS namespace: ' ~ (host_uts_containers | join(' | '))
              if (host_uts_containers is defined and host_uts_containers | length > 0) else
              'No containers are sharing the host UTS namespace.'
            }}
          remediation: >-
            Remove --uts=host from docker run commands.
            Containers should use their own isolated UTS namespace (the default).
          raw_output: "{{ utsmode_raw.stdout | default('No containers') | string }}"

    - name: "5.21 | Append result"
      set_fact:
        audit_results: "{{ audit_results + [check_5_21] }}"

    # ──────────────────────────────────────────────
    # 5.22 – Default seccomp profile not disabled
    # ──────────────────────────────────────────────
    # seccomp restricts which syscalls a container process can make.
    # SecurityOpt containing "seccomp=unconfined" disables all restrictions.
    # An empty SecurityOpt means the default profile is active — that's fine.
    - name: "5.22 | Inspect SecurityOpt for seccomp on all containers"
      command: >
        docker inspect
        --format '{{ '{{' }}.Id{{ '}}' }}:SecurityOpt={{ '{{' }}json .HostConfig.SecurityOpt{{ '}}' }}'
        {{ container_ids_raw.stdout_lines | join(' ') }}
      register: seccomp_raw
      changed_when: false
      failed_when: false
      when: container_ids_raw.stdout != ""

    - name: "5.22 | Detect containers with seccomp disabled"
      set_fact:
        seccomp_disabled: >-
          {{
            seccomp_raw.stdout_lines
            | select('search', 'seccomp=unconfined')
            | list
          }}
      when:
        - container_ids_raw.stdout != ""
        - seccomp_raw is defined
        - seccomp_raw.rc == 0

    - name: "5.22 | Evaluate seccomp profile"
      set_fact:
        check_5_22:
          id: "5.22"
          section: "Section 5 - Container Runtime Security"
          title: "Ensure the default seccomp profile is not disabled"
          status: >-
            {{
              'SKIP' if container_ids_raw.stdout == '' else
              'FAIL' if (seccomp_disabled is defined and seccomp_disabled | length > 0) else
              'PASS'
            }}
          details: >-
            {{
              'No containers found.' if container_ids_raw.stdout == '' else
              'Containers with seccomp disabled (seccomp=unconfined): ' ~ (seccomp_disabled | join(' | '))
              if (seccomp_disabled is defined and seccomp_disabled | length > 0) else
              'All containers are using the default seccomp profile.'
            }}
          remediation: >-
            Remove --security-opt seccomp=unconfined from docker run commands.
            The Docker default seccomp profile blocks ~44 dangerous syscalls automatically.
            If a custom profile is needed: --security-opt seccomp=/path/to/profile.json
          raw_output: "{{ seccomp_raw.stdout | default('No containers') | string }}"

    - name: "5.22 | Append result"
      set_fact:
        audit_results: "{{ audit_results + [check_5_22] }}"

    # ──────────────────────────────────────────────
    # 5.23 – docker exec not used with --privileged
    # ──────────────────────────────────────────────
    # This cannot be detected at rest via docker inspect — it only exists in
    # the moment the exec is run. The audit checks daemon audit logs for the
    # pattern. If auditd is not installed the check returns INFO.
    - name: "5.23 | Search daemon logs for exec with --privileged"
      shell: >
        journalctl -u docker --no-pager --since "7 days ago" 2>/dev/null
        | grep -i 'exec.*privileged'
      register: exec_priv_raw
      changed_when: false
      failed_when: false

    - name: "5.23 | Evaluate privileged exec usage"
      set_fact:
        check_5_23:
          id: "5.23"
          section: "Section 5 - Container Runtime Security"
          title: "Ensure that docker exec commands are not used with the privileged option"
          status: >-
            {{
              'FAIL' if exec_priv_raw.rc == 0 and exec_priv_raw.stdout != '' else
              'PASS' if exec_priv_raw.rc == 1 else
              'INFO'
            }}
          details: >-
            {{
              'docker exec --privileged usage detected in daemon logs (last 7 days): ' ~ exec_priv_raw.stdout[:300]
              if exec_priv_raw.rc == 0 and exec_priv_raw.stdout != '' else
              'No docker exec --privileged usage found in daemon logs (last 7 days).'
              if exec_priv_raw.rc == 1 else
              'Could not query daemon logs. Manual review of docker exec usage required.'
            }}
          remediation: >-
            Never use: docker exec --privileged <container> <command>
            Use specific capabilities if elevated access is required in a running container.
            Audit all docker exec usage via centralized logging.
          raw_output: "{{ exec_priv_raw.stdout | default('No log output') | string }}"

    - name: "5.23 | Append result"
      set_fact:
        audit_results: "{{ audit_results + [check_5_23] }}"

    # ──────────────────────────────────────────────
    # 5.24 – docker exec not used with --user=root
    # ──────────────────────────────────────────────
    # Same pattern as 5.23 — runtime-only, detected via logs.
    - name: "5.24 | Search daemon logs for exec with --user=root"
      shell: >
        journalctl -u docker --no-pager --since "7 days ago" 2>/dev/null
        | grep -iE 'exec.*(--user=root|user.*root)'
      register: exec_root_raw
      changed_when: false
      failed_when: false

    - name: "5.24 | Evaluate root exec usage"
      set_fact:
        check_5_24:
          id: "5.24"
          section: "Section 5 - Container Runtime Security"
          title: "Ensure that docker exec commands are not used with the user=root option"
          status: >-
            {{
              'FAIL' if exec_root_raw.rc == 0 and exec_root_raw.stdout != '' else
              'PASS' if exec_root_raw.rc == 1 else
              'INFO'
            }}
          details: >-
            {{
              'docker exec --user=root usage detected in daemon logs (last 7 days).'
              if exec_root_raw.rc == 0 and exec_root_raw.stdout != '' else
              'No docker exec --user=root usage found in daemon logs (last 7 days).'
              if exec_root_raw.rc == 1 else
              'Could not query daemon logs. Manual review of docker exec --user usage required.'
            }}
          remediation: >-
            Never use: docker exec --user=root <container> <command>
            Containers should run as a non-root user defined in the Dockerfile with USER directive.
            Use docker exec as that non-root user instead.
          raw_output: "{{ exec_root_raw.stdout | default('No log output') | string }}"

    - name: "5.24 | Append result"
      set_fact:
        audit_results: "{{ audit_results + [check_5_24] }}"

    # ──────────────────────────────────────────────
    # 5.25 – cgroup usage confirmed
    # ──────────────────────────────────────────────
    # Docker should use the default "cgroupfs" or systemd cgroup driver.
    # A custom --cgroup-parent that places containers outside the default
    # hierarchy can bypass resource limits set by the orchestrator.
    - name: "5.25 | Inspect CgroupParent on all containers"
      command: >
        docker inspect
        --format '{{ '{{' }}.Id{{ '}}' }}:CgroupParent={{ '{{' }}.HostConfig.CgroupParent{{ '}}' }}'
        {{ container_ids_raw.stdout_lines | join(' ') }}
      register: cgroup_raw
      changed_when: false
      failed_when: false
      when: container_ids_raw.stdout != ""

    - name: "5.25 | Detect containers with non-default cgroup parent"
      set_fact:
        custom_cgroup: >-
          {{
            cgroup_raw.stdout_lines
            | reject('search', 'CgroupParent=$')
            | list
          }}
      when:
        - container_ids_raw.stdout != ""
        - cgroup_raw is defined
        - cgroup_raw.rc == 0

    - name: "5.25 | Evaluate cgroup usage"
      set_fact:
        check_5_25:
          id: "5.25"
          section: "Section 5 - Container Runtime Security"
          title: "Ensure that cgroup usage is confirmed"
          status: >-
            {{
              'SKIP' if container_ids_raw.stdout == '' else
              'WARN' if (custom_cgroup is defined and custom_cgroup | length > 0) else
              'PASS'
            }}
          details: >-
            {{
              'No containers found.' if container_ids_raw.stdout == '' else
              'Containers with custom cgroup parent (verify these are intentional): ' ~ (custom_cgroup | join(' | '))
              if (custom_cgroup is defined and custom_cgroup | length > 0) else
              'All containers are using the default cgroup hierarchy.'
            }}
          remediation: >-
            Only use --cgroup-parent if required by your orchestrator.
            Confirm that custom cgroup parents still have resource limits enforced.
            Remove --cgroup-parent from containers where it was set unintentionally.
          raw_output: "{{ cgroup_raw.stdout | default('No containers') | string }}"

    - name: "5.25 | Append result"
      set_fact:
        audit_results: "{{ audit_results + [check_5_25] }}"

    # ──────────────────────────────────────────────
    # 5.26 – Container restricted from acquiring additional privileges
    # ──────────────────────────────────────────────
    # no-new-privileges prevents the container process from gaining privileges
    # via setuid/setgid binaries. SecurityOpt should contain "no-new-privileges".
    - name: "5.26 | Inspect no-new-privileges SecurityOpt on all containers"
      command: >
        docker inspect
        --format '{{ '{{' }}.Id{{ '}}' }}:SecurityOpt={{ '{{' }}json .HostConfig.SecurityOpt{{ '}}' }}'
        {{ container_ids_raw.stdout_lines | join(' ') }}
      register: nnp_raw
      changed_when: false
      failed_when: false
      when: container_ids_raw.stdout != ""

    - name: "5.26 | Detect containers missing no-new-privileges"
      set_fact:
        missing_nnp: >-
          {{
            nnp_raw.stdout_lines
            | reject('search', 'no-new-privileges')
            | list
          }}
      when:
        - container_ids_raw.stdout != ""
        - nnp_raw is defined
        - nnp_raw.rc == 0

    - name: "5.26 | Evaluate no-new-privileges"
      set_fact:
        check_5_26:
          id: "5.26"
          section: "Section 5 - Container Runtime Security"
          title: "Ensure that the container is restricted from acquiring additional privileges"
          status: >-
            {{
              'SKIP' if container_ids_raw.stdout == '' else
              'FAIL' if (missing_nnp is defined and missing_nnp | length > 0) else
              'PASS'
            }}
          details: >-
            {{
              'No containers found.' if container_ids_raw.stdout == '' else
              'Containers missing no-new-privileges: ' ~ (missing_nnp | map('regex_replace', ':SecurityOpt=.*', '') | join(', '))
              if (missing_nnp is defined and missing_nnp | length > 0) else
              'All containers have no-new-privileges set.'
            }}
          remediation: >-
            Add --security-opt=no-new-privileges to all docker run commands.
            This prevents setuid/setgid programs from escalating privileges inside the container.
          raw_output: "{{ nnp_raw.stdout | default('No containers') | string }}"

    - name: "5.26 | Append result"
      set_fact:
        audit_results: "{{ audit_results + [check_5_26] }}"

    # ──────────────────────────────────────────────
    # 5.27 – Container health checked at runtime
    # ──────────────────────────────────────────────
    # Health.Status == "none" means no HEALTHCHECK is defined — Docker has no
    # way to know if the containerized service is actually functioning.
    - name: "5.27 | Inspect health status on all containers"
      command: >
        docker inspect
        --format '{{ '{{' }}.Id{{ '}}' }}:Health={{ '{{' }}.State.Health.Status{{ '}}' }}'
        {{ container_ids_raw.stdout_lines | join(' ') }}
      register: health_raw
      changed_when: false
      failed_when: false
      when: container_ids_raw.stdout != ""

    - name: "5.27 | Detect containers with no health check"
      set_fact:
        no_healthcheck: >-
          {{
            health_raw.stdout_lines
            | select('search', 'Health=$')
            | list
          }}
      when:
        - container_ids_raw.stdout != ""
        - health_raw is defined
        - health_raw.rc == 0

    - name: "5.27 | Evaluate health check"
      set_fact:
        check_5_27:
          id: "5.27"
          section: "Section 5 - Container Runtime Security"
          title: "Ensure that container health is checked at runtime"
          status: >-
            {{
              'SKIP' if container_ids_raw.stdout == '' else
              'FAIL' if (no_healthcheck is defined and no_healthcheck | length > 0) else
              'PASS'
            }}
          details: >-
            {{
              'No containers found.' if container_ids_raw.stdout == '' else
              'Containers with no HEALTHCHECK defined: ' ~ (no_healthcheck | map('regex_replace', ':Health=.*', '') | join(', '))
              if (no_healthcheck is defined and no_healthcheck | length > 0) else
              'All containers have a health check configured.'
            }}
          remediation: >-
            Add a HEALTHCHECK instruction to your Dockerfile:
            HEALTHCHECK --interval=30s --timeout=10s --retries=3 CMD curl -f http://localhost/ || exit 1
            Or pass at runtime: docker run --health-cmd="..." --health-interval=30s ...
          raw_output: "{{ health_raw.stdout | default('No containers') | string }}"

    - name: "5.27 | Append result"
      set_fact:
        audit_results: "{{ audit_results + [check_5_27] }}"

    # ──────────────────────────────────────────────
    # 5.28 – Images use specific tags, not "latest"
    # ──────────────────────────────────────────────
    # Using "latest" means you can't guarantee which image version is running
    # and an upstream compromise of the "latest" tag silently affects you.
    - name: "5.28 | Inspect image tags on all containers"
      command: >
        docker inspect
        --format '{{ '{{' }}.Id{{ '}}' }}:Image={{ '{{' }}.Config.Image{{ '}}' }}'
        {{ container_ids_raw.stdout_lines | join(' ') }}
      register: image_tags_raw
      changed_when: false
      failed_when: false
      when: container_ids_raw.stdout != ""

    - name: "5.28 | Detect containers using 'latest' tag or no tag"
      set_fact:
        latest_tag_containers: >-
          {{
            image_tags_raw.stdout_lines
            | select('search', ':latest$')
            | list
            + image_tags_raw.stdout_lines
            | reject('search', 'Image=.*:')
            | list
          }}
      when:
        - container_ids_raw.stdout != ""
        - image_tags_raw is defined
        - image_tags_raw.rc == 0

    - name: "5.28 | Evaluate image versioning"
      set_fact:
        check_5_28:
          id: "5.28"
          section: "Section 5 - Container Runtime Security"
          title: "Ensure that Docker commands always make use of the latest version of their image"
          status: >-
            {{
              'SKIP' if container_ids_raw.stdout == '' else
              'FAIL' if (latest_tag_containers is defined and latest_tag_containers | length > 0) else
              'PASS'
            }}
          details: >-
            {{
              'No containers found.' if container_ids_raw.stdout == '' else
              'Containers using latest tag or untagged image: ' ~ (latest_tag_containers | join(' | '))
              if (latest_tag_containers is defined and latest_tag_containers | length > 0) else
              'All containers are using explicitly versioned images.'
            }}
          remediation: >-
            Always pin images to a specific version tag or SHA digest:
            image: nginx:1.25.3   (version tag)
            image: nginx@sha256:abc123...  (digest — most secure)
            Avoid: image: nginx  or  image: nginx:latest
          raw_output: "{{ image_tags_raw.stdout | default('No containers') | string }}"

    - name: "5.28 | Append result"
      set_fact:
        audit_results: "{{ audit_results + [check_5_28] }}"

    # ──────────────────────────────────────────────
    # 5.29 – PIDs cgroup limit used
    # ──────────────────────────────────────────────
    # PidsLimit=0 or -1 means no PID limit — a fork bomb inside the container
    # can exhaust the host's process table.
    - name: "5.29 | Inspect PidsLimit on all containers"
      command: >
        docker inspect
        --format '{{ '{{' }}.Id{{ '}}' }}:PidsLimit={{ '{{' }}.HostConfig.PidsLimit{{ '}}' }}'
        {{ container_ids_raw.stdout_lines | join(' ') }}
      register: pids_raw
      changed_when: false
      failed_when: false
      when: container_ids_raw.stdout != ""

    - name: "5.29 | Detect containers with no PID limit"
      set_fact:
        no_pid_limit: >-
          {{
            pids_raw.stdout_lines
            | select('search', 'PidsLimit=0$')
            | list
            + pids_raw.stdout_lines
            | select('search', 'PidsLimit=-1$')
            | list
          }}
      when:
        - container_ids_raw.stdout != ""
        - pids_raw is defined
        - pids_raw.rc == 0

    - name: "5.29 | Evaluate PID limit"
      set_fact:
        check_5_29:
          id: "5.29"
          section: "Section 5 - Container Runtime Security"
          title: "Ensure that the PIDs cgroup limit is used"
          status: >-
            {{
              'SKIP' if container_ids_raw.stdout == '' else
              'FAIL' if (no_pid_limit is defined and no_pid_limit | length > 0) else
              'PASS'
            }}
          details: >-
            {{
              'No containers found.' if container_ids_raw.stdout == '' else
              'Containers with no PID limit: ' ~ (no_pid_limit | join(' | '))
              if (no_pid_limit is defined and no_pid_limit | length > 0) else
              'All containers have a PIDs cgroup limit configured.'
            }}
          remediation: >-
            Set a PID limit when starting containers:
            docker run --pids-limit=100 ...
            Choose a value appropriate to the expected workload.
            Even a high value (e.g. 1000) provides fork bomb protection.
          raw_output: "{{ pids_raw.stdout | default('No containers') | string }}"

    - name: "5.29 | Append result"
      set_fact:
        audit_results: "{{ audit_results + [check_5_29] }}"

    # ──────────────────────────────────────────────
    # 5.30 – Docker default bridge docker0 not used
    # ──────────────────────────────────────────────
    # Containers on the default docker0 bridge can communicate with each other
    # without any network policy. User-defined networks provide DNS-based
    # discovery and proper network isolation between containers.
    - name: "5.30 | Inspect network settings on all containers"
      command: >
        docker inspect
        --format '{{ '{{' }}.Id{{ '}}' }}:Networks={{ '{{' }}json .NetworkSettings.Networks{{ '}}' }}'
        {{ container_ids_raw.stdout_lines | join(' ') }}
      register: network_raw
      changed_when: false
      failed_when: false
      when: container_ids_raw.stdout != ""

    - name: "5.30 | Detect containers on default docker0 bridge"
      set_fact:
        docker0_containers: >-
          {{
            network_raw.stdout_lines
            | select('search', '"bridge":')
            | list
          }}
      when:
        - container_ids_raw.stdout != ""
        - network_raw is defined
        - network_raw.rc == 0

    - name: "5.30 | Evaluate bridge network usage"
      set_fact:
        check_5_30:
          id: "5.30"
          section: "Section 5 - Container Runtime Security"
          title: "Ensure that Docker's default bridge docker0 is not used"
          status: >-
            {{
              'SKIP' if container_ids_raw.stdout == '' else
              'FAIL' if (docker0_containers is defined and docker0_containers | length > 0) else
              'PASS'
            }}
          details: >-
            {{
              'No containers found.' if container_ids_raw.stdout == '' else
              'Containers on the default docker0 bridge: ' ~ (docker0_containers | map('regex_replace', ':Networks=.*', '') | join(', '))
              if (docker0_containers is defined and docker0_containers | length > 0) else
              'No containers are using the default docker0 bridge.'
            }}
          remediation: >-
            Create user-defined bridge networks and connect containers to them:
            docker network create my-app-network
            docker run --network=my-app-network ...
            This provides container DNS resolution and proper network isolation.
          raw_output: "{{ network_raw.stdout | default('No containers') | string }}"

    - name: "5.30 | Append result"
      set_fact:
        audit_results: "{{ audit_results + [check_5_30] }}"

    # ──────────────────────────────────────────────
    # 5.31 – Host user namespace not shared
    # ──────────────────────────────────────────────
    # --userns=host disables user namespace remapping — root inside the
    # container IS root on the host, with full UID 0 privileges.
    - name: "5.31 | Inspect UsernsMode on all containers"
      command: >
        docker inspect
        --format '{{ '{{' }}.Id{{ '}}' }}:UsernsMode={{ '{{' }}.HostConfig.UsernsMode{{ '}}' }}'
        {{ container_ids_raw.stdout_lines | join(' ') }}
      register: userns_raw
      changed_when: false
      failed_when: false
      when: container_ids_raw.stdout != ""

    - name: "5.31 | Detect containers sharing host user namespace"
      set_fact:
        host_userns_containers: >-
          {{
            userns_raw.stdout_lines
            | select('search', 'UsernsMode=host')
            | list
          }}
      when:
        - container_ids_raw.stdout != ""
        - userns_raw is defined
        - userns_raw.rc == 0

    - name: "5.31 | Evaluate user namespace"
      set_fact:
        check_5_31:
          id: "5.31"
          section: "Section 5 - Container Runtime Security"
          title: "Ensure that the host's user namespaces are not shared"
          status: >-
            {{
              'SKIP' if container_ids_raw.stdout == '' else
              'FAIL' if (host_userns_containers is defined and host_userns_containers | length > 0) else
              'PASS'
            }}
          details: >-
            {{
              'No containers found.' if container_ids_raw.stdout == '' else
              'Containers sharing host user namespace (root=root): ' ~ (host_userns_containers | join(' | '))
              if (host_userns_containers is defined and host_userns_containers | length > 0) else
              'No containers are sharing the host user namespace.'
            }}
          remediation: >-
            Remove --userns=host from docker run commands.
            Enable user namespace remapping in daemon.json for full UID isolation:
            { "userns-remap": "default" }
          raw_output: "{{ userns_raw.stdout | default('No containers') | string }}"

    - name: "5.31 | Append result"
      set_fact:
        audit_results: "{{ audit_results + [check_5_31] }}"

    # ──────────────────────────────────────────────
    # 5.32 – Docker socket not mounted in containers
    # ──────────────────────────────────────────────
    # Mounting /var/run/docker.sock gives the container full control of the
    # Docker daemon — it can spawn privileged containers, read all secrets,
    # and completely escape container isolation. This is a critical finding.
    - name: "5.32 | Inspect mounts for docker.sock on all containers"
      command: >
        docker inspect
        --format '{{ '{{' }}.Id{{ '}}' }}:Mounts={{ '{{' }}json .Mounts{{ '}}' }}'
        {{ container_ids_raw.stdout_lines | join(' ') }}
      register: dockersock_raw
      changed_when: false
      failed_when: false
      when: container_ids_raw.stdout != ""

    - name: "5.32 | Detect containers with docker.sock mounted"
      set_fact:
        dockersock_containers: >-
          {{
            dockersock_raw.stdout_lines
            | select('search', 'docker.sock')
            | list
          }}
      when:
        - container_ids_raw.stdout != ""
        - dockersock_raw is defined
        - dockersock_raw.rc == 0

    - name: "5.32 | Evaluate docker socket mounting"
      set_fact:
        check_5_32:
          id: "5.32"
          section: "Section 5 - Container Runtime Security"
          title: "Ensure that the Docker socket is not mounted inside any containers"
          status: >-
            {{
              'SKIP' if container_ids_raw.stdout == '' else
              'FAIL' if (dockersock_containers is defined and dockersock_containers | length > 0) else
              'PASS'
            }}
          details: >-
            {{
              'No containers found.' if container_ids_raw.stdout == '' else
              'CRITICAL - Containers with docker.sock mounted (full daemon escape possible): ' ~ (dockersock_containers | map('regex_replace', ':Mounts=.*', '') | join(', '))
              if (dockersock_containers is defined and dockersock_containers | length > 0) else
              'No containers have the Docker socket mounted.'
            }}
          remediation: >-
            Remove -v /var/run/docker.sock:/var/run/docker.sock from all docker run commands.
            If the container needs to manage Docker (e.g. CI agents), use the Docker TCP API
            with TLS authentication instead, or use purpose-built tools (Kaniko, Buildah)
            that do not require socket access.
          raw_output: "{{ dockersock_raw.stdout | default('No containers') | string }}"

    - name: "5.32 | Append result"
      set_fact:
        audit_results: "{{ audit_results + [check_5_32] }}"

    











    # ──────────────────────────────────────────────
    # Summary counts
    # ──────────────────────────────────────────────
    - name: Compute summary statistics
      set_fact:
        summary_pass:  "{{ audit_results | selectattr('status', 'equalto', 'PASS') | list | length }}"
        summary_fail:  "{{ audit_results | selectattr('status', 'equalto', 'FAIL') | list | length }}"
        summary_skip:  "{{ audit_results | selectattr('status', 'equalto', 'SKIP') | list | length }}"
        summary_info:  "{{ audit_results | selectattr('status', 'equalto', 'INFO') | list | length }}"
        summary_total: "{{ audit_results | length }}"

    # ══════════════════════════════════════════════
    # KEY FIX: write ALL audit data to a JSON file.
    # The Python script reads this file directly —
    # no data is ever interpolated into Python source.
    # This sidesteps every quoting / escaping issue.
    # ══════════════════════════════════════════════
    - name: Write audit data to JSON file on target
      copy:
        dest: "{{ data_file }}"
        mode: '0600'
        content: "{{ {'meta': {'host': ansible_hostname,
                               'docker_ver': docker_version.stdout | default('unknown'),
                               'os': ansible_distribution ~ ' ' ~ ansible_distribution_version,
                               'generated': ansible_date_time.iso8601,
                               'pass': summary_pass | int,
                               'fail': summary_fail | int,
                               'skip': summary_skip | int,
                               'info': summary_info | int,
                               'total': summary_total | int},
                      'results': audit_results} | to_nice_json }}"

    # ──────────────────────────────────────────────
    # Write the Python script – contains ONLY the
    # two file-path strings as Jinja2, nothing else.
    # ──────────────────────────────────────────────
    - name: Write Excel report generator script
      copy:
        dest: "{{ python_script }}"
        mode: '0700'
        content: |
          #!/usr/bin/env python3
          import json
          from openpyxl import Workbook
          from openpyxl.styles import Font, PatternFill, Alignment, Border, Side
          from openpyxl.chart import BarChart, Reference

          DATA_FILE = "{{ data_file }}"
          OUTPUT    = "{{ report_file }}"

          with open(DATA_FILE) as fh:
              payload = json.load(fh)

          META          = payload["meta"]
          AUDIT_RESULTS = payload["results"]

          # ── Palette ──────────────────────────────────────────────────────
          P = dict(
              TITLE_BG="0F3460", HEADER_BG="1F2D3D", HEADER_FG="FFFFFF",
              PASS_BG="D6F4DC",  PASS_FG="1A6E2E",
              FAIL_BG="FAD7D5",  FAIL_FG="9C2B26",
              SKIP_BG="E8E8E8",  SKIP_FG="555555",
              INFO_BG="D0E8FF",  INFO_FG="1A4E8A",
              ROW_ALT="F6F8FA",  BORDER="BFC9D4",
          )
          STATUS_MAP = {
              "PASS": (P["PASS_BG"], P["PASS_FG"], "PASS"),
              "FAIL": (P["FAIL_BG"], P["FAIL_FG"], "FAIL"),
              "SKIP": (P["SKIP_BG"], P["SKIP_FG"], "SKIP"),
              "INFO": (P["INFO_BG"], P["INFO_FG"], "INFO"),
          }

          def fill(c):
              return PatternFill("solid", fgColor=c)

          def bdr(c=None):
              s = Side(style="thin", color=c or P["BORDER"])
              return Border(left=s, right=s, top=s, bottom=s)

          def font(bold=False, size=10, color="000000", italic=False):
              return Font(name="Arial", bold=bold, size=size, color=color, italic=italic)

          def align(h="left", v="top", wrap=True):
              return Alignment(horizontal=h, vertical=v, wrap_text=wrap)

          def safe(v):
              """Convert any non-Excel-primitive to a string."""
              return v if isinstance(v, (str, int, float, bool, type(None))) else json.dumps(v)

          wb = Workbook()

          # ════════════════════════════════════════════════════════════════
          # Sheet 1 – SUMMARY
          # ════════════════════════════════════════════════════════════════
          ws = wb.active
          ws.title = "Summary"
          ws.sheet_view.showGridLines = False
          ws.column_dimensions["A"].width = 2

          # Title
          ws.merge_cells("B1:J2")
          c = ws["B1"]
          c.value     = "Docker CIS Benchmark Audit  -  Section 5"
          c.font      = font(bold=True, size=20, color=P["HEADER_FG"])
          c.fill      = fill(P["TITLE_BG"])
          c.alignment = align("left", "center", wrap=False)
          ws.row_dimensions[1].height = 20
          ws.row_dimensions[2].height = 22

          # Subtitle
          ws.merge_cells("B3:J3")
          c = ws["B3"]
          c.value = (f"Container Runtime Security  |  Host: {META['host']}"
                     f"  |  Docker: {META['docker_ver']}"
                     f"  |  OS: {META['os']}"
                     f"  |  {META['generated']}")
          c.font      = font(size=9, color="AAAAAA", italic=True)
          c.fill      = fill(P["TITLE_BG"])
          c.alignment = align("left", "center", wrap=False)
          ws.row_dimensions[3].height = 16
          ws.row_dimensions[4].height = 12

          # Stat cards
          cards = [
              ("B","C", "TOTAL CHECKS", META["total"], P["HEADER_BG"], P["HEADER_FG"]),
              ("D","E", "PASSED",       META["pass"],  P["PASS_BG"],   P["PASS_FG"]),
              ("F","G", "FAILED",       META["fail"],  P["FAIL_BG"],   P["FAIL_FG"]),
              ("H","I", "INFO / SKIP",  META["info"]+META["skip"], P["INFO_BG"], P["INFO_FG"]),
          ]
          for c1, c2, label, val, _bg, fg in cards:
              ws.merge_cells(f"{c1}5:{c2}5")
              lc = ws[f"{c1}5"]
              lc.value = label
              lc.font  = font(bold=True, size=9, color="555555")
              lc.fill  = fill("EAECEF")
              lc.alignment = align("center", "center", wrap=False)
              lc.border = bdr()
              ws.merge_cells(f"{c1}6:{c2}6")
              vc = ws[f"{c1}6"]
              vc.value = val
              vc.font  = font(bold=True, size=30, color=fg)
              vc.fill  = fill("FFFFFF")
              vc.alignment = align("center", "center", wrap=False)
              vc.border = bdr()
          ws.row_dimensions[5].height = 20
          ws.row_dimensions[6].height = 46
          ws.row_dimensions[7].height = 12

          # Compliance bar
          total = META["total"] or 1
          pct   = round(META["pass"] / total * 100, 1)
          bar   = chr(9608) * int(pct/5) + chr(9617) * (20 - int(pct/5))
          ws.merge_cells("B8:J8")
          bc = ws["B8"]
          bc.value = f"  Compliance:  {bar}  {pct}%  ({META['pass']} / {META['total']} passed)"
          bc.font  = font(bold=True, size=11,
                          color=P["PASS_FG"] if pct >= 80 else P["FAIL_FG"])
          bc.fill  = fill("EAF4EA" if pct >= 80 else "FAE8E8")
          bc.alignment = align("left", "center", wrap=False)
          bc.border = bdr()
          ws.row_dimensions[8].height = 28
          ws.row_dimensions[9].height = 12

          # Quick results table
          spans = {"B":("B","C"), "D":("D","E"), "F":("F","F"), "G":("G","J")}
          HDR   = 10
          for col, hdr in zip(["B","D","F","G"],
                               ["Check ID","Title","Status","Details"]):
              c1, c2 = spans[col]
              ws.merge_cells(f"{c1}{HDR}:{c2}{HDR}")
              cell = ws[f"{col}{HDR}"]
              cell.value     = hdr
              cell.font      = font(bold=True, size=10, color=P["HEADER_FG"])
              cell.fill      = fill(P["HEADER_BG"])
              cell.alignment = align("center", "center", wrap=False)
              cell.border    = bdr()
          ws.row_dimensions[HDR].height = 22

          for i, result in enumerate(AUDIT_RESULTS):
              r  = HDR + 1 + i
              bg = "FFFFFF" if i % 2 == 0 else P["ROW_ALT"]
              sbg, sfg, slabel = STATUS_MAP.get(
                  result["status"], (P["SKIP_BG"], P["SKIP_FG"], result["status"]))
              row = {"B": result["id"], "D": result["title"],
                     "F": slabel,       "G": result["details"]}
              for col, val in row.items():
                  c1, c2 = spans[col]
                  ws.merge_cells(f"{c1}{r}:{c2}{r}")
                  cell = ws[f"{col}{r}"]
                  cell.value     = safe(val)
                  cell.border    = bdr()
                  cell.alignment = align("center" if col in ("B","F") else "left", "center")
                  if col == "F":
                      cell.font = font(bold=True, color=sfg)
                      cell.fill = fill(sbg)
                  else:
                      cell.font = font()
                      cell.fill = fill(bg)
              ws.row_dimensions[r].height = 26

          for col, w in {"B":9,"C":5,"D":28,"E":5,"F":13,"G":28,"H":14,"I":1,"J":1}.items():
              ws.column_dimensions[col].width = w

          # ════════════════════════════════════════════════════════════════
          # Sheet 2 – DETAILED RESULTS
          # ════════════════════════════════════════════════════════════════
          ws2 = wb.create_sheet("Detailed Results")
          ws2.sheet_view.showGridLines = False
          ws2.column_dimensions["A"].width = 2

          det_cols = [
              ("B","Check ID",10),("C","Section",28),("D","Title",36),
              ("E","Status",13),("F","Details",42),("G","Remediation",42),
              ("H","Raw Output",38),
          ]
          for col, label, width in det_cols:
              c = ws2[f"{col}1"]
              c.value     = label
              c.font      = font(bold=True, size=10, color=P["HEADER_FG"])
              c.fill      = fill(P["HEADER_BG"])
              c.alignment = align("center", "center", wrap=False)
              c.border    = bdr()
              ws2.column_dimensions[col].width = width
          ws2.row_dimensions[1].height = 22

          for i, result in enumerate(AUDIT_RESULTS):
              r  = i + 2
              bg = "FFFFFF" if i % 2 == 0 else P["ROW_ALT"]
              sbg, sfg, slabel = STATUS_MAP.get(
                  result["status"], (P["SKIP_BG"], P["SKIP_FG"], result["status"]))
              det = {
                  "B": result["id"],          "C": result["section"],
                  "D": result["title"],       "E": slabel,
                  "F": result["details"],     "G": result["remediation"],
                  "H": result["raw_output"],
              }
              for col, val in det.items():
                  cell = ws2[f"{col}{r}"]
                  cell.value     = safe(val)
                  cell.border    = bdr()
                  cell.alignment = align("center" if col in ("B","E") else "left", "top")
                  if col == "E":
                      cell.font = font(bold=True, color=sfg)
                      cell.fill = fill(sbg)
                  else:
                      cell.font = font()
                      cell.fill = fill(bg)
              ws2.row_dimensions[r].height = 44

          ws2.freeze_panes = "B2"
          ws2.auto_filter.ref = f"B1:H{len(AUDIT_RESULTS)+1}"

          # ════════════════════════════════════════════════════════════════
          # Sheet 3 – CHART
          # ════════════════════════════════════════════════════════════════
          ws3 = wb.create_sheet("Chart")
          ws3.sheet_view.showGridLines = False
          ws3.column_dimensions["A"].width = 2

          for ri, (s, v) in enumerate([("Status","Count"),
                                        ("PASS", META["pass"]),
                                        ("FAIL", META["fail"]),
                                        ("SKIP", META["skip"]),
                                        ("INFO", META["info"])], 1):
              ws3.cell(row=ri, column=2, value=s)
              ws3.cell(row=ri, column=3, value=v)

          chart = BarChart()
          chart.type   = "col"
          chart.title  = "Section 5 - Audit Results by Status"
          chart.y_axis.title = "Number of Checks"
          chart.x_axis.title = "Status"
          chart.style  = 10
          chart.width  = 20
          chart.height = 14
          chart.add_data(Reference(ws3, min_col=3, max_col=3, min_row=1, max_row=5),
                         titles_from_data=True)
          chart.set_categories(Reference(ws3, min_col=2, max_col=2, min_row=2, max_row=5))
          ws3.add_chart(chart, "B2")

          wb.save(OUTPUT)
          print(f"Report saved: {OUTPUT}")

    # ──────────────────────────────────────────────
    # Run the Python script on the target host
    # ──────────────────────────────────────────────
    - name: Generate Excel report
      command: "python3 {{ python_script }}"
      register: excel_gen
      changed_when: false

    - name: Show generator output
      debug:
        msg: "{{ excel_gen.stdout }}"

    # ──────────────────────────────────────────────
    # Fetch report back to Ansible controller
    # ──────────────────────────────────────────────
    - name: Fetch Excel report to controller
      fetch:
        src: "{{ report_file }}"
        dest: "./docker_benchmark_reports/{{ inventory_hostname }}_section5.xlsx"
        flat: true

    # ──────────────────────────────────────────────
    # Cleanup temp files from target
    # ──────────────────────────────────────────────
    - name: Remove temp files from target
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ python_script }}"
        - "{{ data_file }}"

    # ──────────────────────────────────────────────
    # Console summary
    # ──────────────────────────────────────────────
    - name: Print audit summary
      debug:
        msg: |
          ┌──────────────────────────────────────────────────┐
          │   Docker CIS Benchmark - Section 5 Summary       │
          ├───────────────┬──────────────────────────────────┤
          │ Host          │ {{ ansible_hostname }}
          │ Docker ver    │ {{ docker_version.stdout | default('unknown') }}
          │ Total checks  │ {{ summary_total }}
          │ PASS          │ {{ summary_pass }}
          │ FAIL          │ {{ summary_fail }}
          │ SKIP          │ {{ summary_skip }}
          │ INFO          │ {{ summary_info }}
          │ Excel report  │ {{ report_file }}
          └──────────────────────────────────────────────────┘
          {% for result in audit_results %}
          [{{ result.status }}] {{ result.id }} - {{ result.title }}
             {{ result.details }}
          {% endfor %}
